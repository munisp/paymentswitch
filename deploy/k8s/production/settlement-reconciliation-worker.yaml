apiVersion: apps/v1
kind: Deployment
metadata:
  name: settlement-reconciliation-worker
  namespace: payment-switch
  labels:
    app.kubernetes.io/name: settlement-reconciliation-worker
    app.kubernetes.io/component: settlement-recovery
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: settlement-reconciliation-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: settlement-reconciliation-worker
        app.kubernetes.io/component: settlement-recovery
    spec:
      serviceAccountName: payment-core-runtime
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reconciliation-worker
          image: ${SETTLEMENT_IMAGE:?SETTLEMENT_IMAGE must be set}
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "reconciliation_worker"]
          env:
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: payment-core-runtime-secrets
                  key: postgres-host
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: payment-core-runtime-secrets
                  key: postgres-database
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: payment-core-runtime-secrets
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-core-runtime-secrets
                  key: postgres-password
            - name: SETTLEMENT_LEDGER_URL
              valueFrom:
                secretKeyRef:
                  name: payment-core-runtime-secrets
                  key: settlement-ledger-url
            - name: SETTLEMENT_LEDGER_RECONCILIATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: payment-core-runtime-secrets
                  key: settlement-ledger-reconciliation-token
            - name: SETTLEMENT_LEDGER_CA_FILE
              value: /run/reconciliation-client-tls/ca.crt
            - name: SETTLEMENT_LEDGER_CLIENT_CERT_FILE
              value: /run/reconciliation-client-tls/tls.crt
            - name: SETTLEMENT_LEDGER_CLIENT_KEY_FILE
              value: /run/reconciliation-client-tls/tls.key
            - name: SETTLEMENT_RECONCILIATION_INTERVAL_SECONDS
              value: "10"
            - name: SETTLEMENT_RECONCILIATION_LEASE_SECONDS
              value: "60"
          volumeMounts:
            - name: reconciliation-client-tls
              mountPath: /run/reconciliation-client-tls
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            exec:
              command: ["python", "-c", "import reconciliation_worker"]
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["python", "-c", "import os; assert os.environ.get('SETTLEMENT_LEDGER_URL')"]
            initialDelaySeconds: 5
            periodSeconds: 15
      volumes:
        - name: reconciliation-client-tls
          secret:
            secretName: settlement-reconciliation-client-mtls
            items:
              - key: ca.crt
                path: ca.crt
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: settlement-reconciliation-worker
  namespace: payment-switch
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: settlement-reconciliation-worker

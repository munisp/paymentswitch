apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-secrets
  namespace: payment-switch
  labels:
    security.payment-switch.io/scope: local-only
spec:
  refreshInterval: 1h
  secretStoreRef: {name: local-mock-vault, kind: SecretStore}
  target: {name: postgres-secrets, creationPolicy: Owner}
  data: [{secretKey: url, remoteRef: {key: local-mock-vault-data, property: database_url}}]
---

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tigerbeetle-secrets
  namespace: payment-switch
  labels:
    security.payment-switch.io/scope: local-only
spec:
  refreshInterval: 1h
  secretStoreRef: {name: local-mock-vault, kind: SecretStore}
  target: {name: tigerbeetle-secrets, creationPolicy: Owner}
  data:
    - {secretKey: TIGERBEETLE_CLUSTER_ID, remoteRef: {key: local-mock-vault-data, property: cluster_id}}
    - {secretKey: TIGERBEETLE_REPLICA_ADDRESSES, remoteRef: {key: local-mock-vault-data, property: replica_addresses}}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-credentials
  namespace: payment-switch
  labels:
    security.payment-switch.io/scope: local-only
spec:
  refreshInterval: 1h
  secretStoreRef: {name: local-mock-vault, kind: SecretStore}
  target:
    name: ghcr-credentials
    creationPolicy: Owner
    template: {type: kubernetes.io/dockerconfigjson}
  data: [{secretKey: .dockerconfigjson, remoteRef: {key: local-mock-vault-data, property: .dockerconfigjson}}]

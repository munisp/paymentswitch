apiVersion: v1
kind: ServiceAccount
metadata:
  name: mock-vault-reader
  namespace: payment-switch
  labels:
    security.payment-switch.io/scope: local-only
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: local-mock-vault
  namespace: payment-switch
  labels:
    security.payment-switch.io/scope: local-only
spec:
  provider:
    kubernetes:
      remoteNamespace: payment-switch
      auth:
        serviceAccount:
          name: mock-vault-reader
---
apiVersion: v1
kind: Secret
metadata:
  name: local-mock-vault-data
  namespace: payment-switch
  labels:
    security.payment-switch.io/scope: local-only
    security.payment-switch.io/not-production: "true"
stringData:
  database_url: postgresql://local:local-only@postgres.payment-switch.svc.cluster.local:5432/paymentswitch
  redis_url: redis://redis.payment-switch.svc.cluster.local:6379/0
  client_secret: local-keycloak-client-secret-only
  jwt_secret: local-jwt-secret-only
  cluster_id: "0"
  replica_addresses: tigerbeetle-0.tigerbeetle.payment-switch.svc.cluster.local:3000,tigerbeetle-1.tigerbeetle.payment-switch.svc.cluster.local:3000,tigerbeetle-2.tigerbeetle.payment-switch.svc.cluster.local:3000
  .dockerconfigjson: '{"auths":{}}'

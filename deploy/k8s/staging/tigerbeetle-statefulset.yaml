apiVersion: v1
kind: Service
metadata:
  name: tigerbeetle
  namespace: payment-switch
  labels:
    app.kubernetes.io/name: tigerbeetle
    app.kubernetes.io/component: ledger
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: tigerbeetle
  ports:
    - name: client
      port: 3000
      targetPort: client
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tigerbeetle
  namespace: payment-switch
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tigerbeetle
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tigerbeetle
  namespace: payment-switch
  labels:
    app.kubernetes.io/name: tigerbeetle
    app.kubernetes.io/component: ledger
spec:
  serviceName: tigerbeetle
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: tigerbeetle
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tigerbeetle
        app.kubernetes.io/component: ledger
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: tigerbeetle
              topologyKey: kubernetes.io/hostname
      containers:
        - name: tigerbeetle
          image: ghcr.io/tigerbeetle/tigerbeetle:0.16.30
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          env:
            - name: TB_CLUSTER_ID
              value: "1"
            - name: TB_REPLICA_COUNT
              value: "3"
            - name: TB_ADDRESSES
              value: "tigerbeetle-0.tigerbeetle.payment-switch.svc.cluster.local:3000,tigerbeetle-1.tigerbeetle.payment-switch.svc.cluster.local:3000,tigerbeetle-2.tigerbeetle.payment-switch.svc.cluster.local:3000"
          command: ["/bin/sh", "-ec"]
          args:
            - |
              ordinal="${HOSTNAME##*-}"
              data_file="/var/lib/tigerbeetle/${TB_CLUSTER_ID}_${ordinal}.tigerbeetle"
              if [ ! -f "${data_file}" ]; then
                tigerbeetle format --cluster="${TB_CLUSTER_ID}" --replica-count="${TB_REPLICA_COUNT}" --replica="${ordinal}" "${data_file}"
              fi
              exec tigerbeetle start --addresses="${TB_ADDRESSES}" "${data_file}"
          ports:
            - name: client
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/tigerbeetle
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 100Gi
        storageClassName: fast-ssd

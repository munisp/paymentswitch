apiVersion: v1
kind: Namespace
metadata:
  name: temporal
  labels:
    app.kubernetes.io/part-of: payment-switch
    app.kubernetes.io/environment: staging
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-postgresql
  namespace: temporal
spec:
  selector:
    app.kubernetes.io/name: temporal-postgresql
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-postgresql
  namespace: temporal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-postgresql
    spec:
      containers:
        - name: postgres
          image: postgres:16.4
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: temporal
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: temporal-postgresql
                  key: password
            - name: POSTGRES_DB
              value: temporal
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U temporal -d temporal"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: temporal-postgresql
  namespace: temporal
  labels:
    app.kubernetes.io/part-of: payment-switch
    app.kubernetes.io/environment: staging
    security.payment-switch.io/scope: local-only
stringData:
  password: local-temporal-only-change-me
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-frontend
  namespace: temporal
spec:
  selector:
    app.kubernetes.io/name: temporal
  ports:
    - name: grpc
      port: 7233
      targetPort: 7233
    - name: metrics
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: temporal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
    spec:
      initContainers:
        - name: wait-for-postgresql
          image: postgres:16.4
          command: ["sh", "-ec"]
          args: ["until pg_isready -h temporal-postgresql -U temporal -d temporal; do sleep 2; done"]
      containers:
        - name: temporal
          image: temporalio/auto-setup:1.25.1
          imagePullPolicy: IfNotPresent
          env:
            - name: DB
              value: postgresql
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: temporal
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: temporal-postgresql
                  key: password
            - name: POSTGRES_SEEDS
              value: temporal-postgresql
            - name: DYNAMIC_CONFIG_FILE_PATH
              value: /etc/temporal/config/dynamicconfig/development.yaml
          ports:
            - name: grpc
              containerPort: 7233
            - name: metrics
              containerPort: 9090
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 5
          volumeMounts:
            - name: temporal-config
              mountPath: /etc/temporal/config/dynamicconfig
      volumes:
        - name: temporal-config
          configMap:
            name: temporal-dynamicconfig
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: temporal-dynamicconfig
  namespace: temporal
data:
  development.yaml: |
    frontend.enableClientVersionCheck:
      - value: false
        constraints: {}
    system.enableActivityEagerExecution:
      - value: true
        constraints: {}
---
apiVersion: v1
kind: Service
metadata:
  name: apisix
  namespace: payment-switch
  labels:
    app.kubernetes.io/name: apisix
    app.kubernetes.io/part-of: payment-switch
spec:
  selector:
    app.kubernetes.io/name: apisix
  ports:
    - name: http
      port: 9080
      targetPort: 9080
    - name: admin
      port: 9180
      targetPort: 9180
    - name: metrics
      port: 9091
      targetPort: 9091
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: apisix-config
  namespace: payment-switch
data:
  config.yaml: |
    apisix:
      node_listen: [9080]
    deployment:
      role: data_plane
      role_data_plane:
        config_provider: yaml
      admin:
        admin_key_required: true
        admin_listen:
          ip: 0.0.0.0
          port: 9180
    nginx_config:
      error_log_level: warn
    plugins:
      - prometheus
      - request-id
      - limit-count
    deployment_mode: standalone
  apisix.yaml: |
    routes:
      - id: health
        uri: /health
        methods: [GET]
        upstream:
          nodes:
            "127.0.0.1:9080": 1
        plugins:
          response-rewrite:
            body: '{"status":"ok","runtime":"kind-local"}'
            headers:
              content-type: application/json
    stream_routes: []
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix
  namespace: payment-switch
  labels:
    app.kubernetes.io/name: apisix
    app.kubernetes.io/part-of: payment-switch
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apisix
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apisix
        app.kubernetes.io/part-of: payment-switch
    spec:
      containers:
        - name: apisix
          image: apache/apisix:3.11.0-debian
          imagePullPolicy: IfNotPresent
          env:
            - name: APISIX_STAND_ALONE
              value: "true"
            - name: APISIX_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: apisix-secrets
                  key: admin-key
          ports:
            - name: http
              containerPort: 9080
            - name: admin
              containerPort: 9180
            - name: metrics
              containerPort: 9091
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: apisix-config
              mountPath: /usr/local/apisix/conf/config.yaml
              subPath: config.yaml
            - name: apisix-config
              mountPath: /usr/local/apisix/conf/apisix.yaml
              subPath: apisix.yaml
      volumes:
        - name: apisix-config
          configMap:
            name: apisix-config
---
apiVersion: v1
kind: Secret
metadata:
  name: apisix-secrets
  namespace: payment-switch
  labels:
    security.payment-switch.io/scope: local-only
stringData:
  admin-key: local-apisix-admin-only-change-me

apiVersion: batch/v1
kind: CronJob
metadata:
  name: paymentswitch-multipart-cleanup
  namespace: paymentswitch
  labels:
    app.kubernetes.io/name: paymentswitch-multipart-cleanup
    app.kubernetes.io/component: maintenance
spec:
  schedule: "*/15 * * * *"
  timeZone: "UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: paymentswitch-multipart-cleanup
            app.kubernetes.io/component: maintenance
        spec:
          restartPolicy: Never
          serviceAccountName: paymentswitch-maintenance
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cleanup
              image: ghcr.io/munisp/paymentswitch@sha256:REPLACE_WITH_APPROVED_IMAGE_DIGEST
              imagePullPolicy: IfNotPresent
              command: ["node", "dist/jobs/multipartCleanupRunner.js"]
              env:
                - name: NODE_ENV
                  value: production
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: paymentswitch-database
                      key: DATABASE_URL
                - name: S3_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: paymentswitch-object-storage
                      key: S3_ENDPOINT
                - name: S3_REGION
                  valueFrom:
                    secretKeyRef:
                      name: paymentswitch-object-storage
                      key: S3_REGION
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: paymentswitch-object-storage
                      key: S3_ACCESS_KEY
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: paymentswitch-object-storage
                      key: S3_SECRET_KEY
                - name: S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: paymentswitch-object-storage
                      key: S3_BUCKET
                - name: S3_FORCE_PATH_STYLE
                  value: "false"
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]

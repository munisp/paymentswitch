apiVersion: v1
kind: ServiceAccount
metadata:
  name: paymentswitch-maintenance
  namespace: paymentswitch
  labels:
    app.kubernetes.io/name: paymentswitch-multipart-cleanup
    app.kubernetes.io/component: maintenance
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: paymentswitch-multipart-cleanup-egress
  namespace: paymentswitch
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: paymentswitch-multipart-cleanup
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: paymentswitch
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 4318
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80

          "gridPos": { "h": 7, "w": 6, "x": 18, "y": 0 },
          "options": { "colorMode": "background", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
          "targets": [{ "expr": "sum(rate(paymentswitch_payment_route_requests_total{outcome=~\"client_error|denied|dependency_error|server_error\"}[5m])) / clamp_min(sum(rate(paymentswitch_payment_route_requests_total[5m])), 0.001)", "legendFormat": "Payment error ratio", "refId": "A" }],

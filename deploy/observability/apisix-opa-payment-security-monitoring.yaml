          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "mappings": [], "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "orange", "value": 0.05 }, { "color": "red", "value": 0.10 }] }, "unit": "percentunit" }, "overrides": [] },
          "gridPos": { "h": 7, "w": 6, "x": 6, "y": 0 },
          "options": { "colorMode": "background", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
          "targets": [{ "expr": "sum(rate(paymentswitch_authz_decisions_total{outcome=\"deny\"}[5m])) / clamp_min(sum(rate(paymentswitch_authz_decisions_total[5m])), 0.001)", "legendFormat": "Denied authorization ratio", "refId": "A" }],
          "title": "Authorization Denial Ratio (5m)",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "mappings": [], "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 0 }] }, "unit": "short" }, "overrides": [] },
          "gridPos": { "h": 7, "w": 6, "x": 12, "y": 0 },
          "options": { "colorMode": "background", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },

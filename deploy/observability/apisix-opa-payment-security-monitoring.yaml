          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 15 },
          "options": { "legend": { "calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "targets": [
            { "expr": "sum by (operation, outcome) (rate(paymentswitch_payment_route_requests_total[5m]))", "legendFormat": "{{operation}} / {{outcome}}", "refId": "A" },

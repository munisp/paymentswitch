apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: paymentswitch-apisix
  namespace: paymentswitch
  labels:
    release: kube-prometheus
    app.kubernetes.io/part-of: paymentswitch
spec:
  namespaceSelector:
    matchNames:
      - paymentswitch
  selector:
    matchLabels:
      app.kubernetes.io/name: apisix
  podMetricsEndpoints:
    - port: metrics
      path: /apisix/prometheus/metrics
      interval: 15s
      scrapeTimeout: 5s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: paymentswitch-apisix-security
  namespace: paymentswitch
  labels:
    release: kube-prometheus
    app.kubernetes.io/part-of: paymentswitch
spec:
  namespaceSelector:
    matchNames:
      - paymentswitch
  selector:
    matchLabels:
      app.kubernetes.io/name: apisix
  podMetricsEndpoints:
    - port: authz-metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 5s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_container_name]
          regex: opa-authz-sidecar
          action: keep
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: paymentswitch-opa-diagnostics
  namespace: paymentswitch
  labels:
    release: kube-prometheus
    app.kubernetes.io/part-of: paymentswitch
spec:
  namespaceSelector:
    matchNames:
      - paymentswitch
  selector:
    matchLabels:
      app.kubernetes.io/name: opa-authz
  podMetricsEndpoints:
    - port: diagnostics
      path: /metrics
      interval: 15s
      scrapeTimeout: 5s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: paymentswitch-api
  namespace: paymentswitch
  labels:
    release: kube-prometheus
    app.kubernetes.io/part-of: paymentswitch
spec:
  namespaceSelector:
    matchNames:
      - paymentswitch
  selector:
    matchLabels:
      app.kubernetes.io/name: paymentswitch-api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 5s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: paymentswitch-apisix-opa-payment-security
  namespace: paymentswitch
  labels:
    release: kube-prometheus
    app.kubernetes.io/part-of: paymentswitch
spec:
  groups:
    - name: paymentswitch.gateway-security
      rules:
        - alert: PaymentswitchApisixHigh5xxRate
          expr: |
            sum(rate(apisix_http_status{code=~"5.."}[5m]))
            / clamp_min(sum(rate(apisix_http_status[5m])), 0.001) > 0.01
          for: 10m
          labels:
            severity: critical
            service: apisix
            paging: "true"
          annotations:
            summary: APISIX gateway 5xx rate exceeds one percent
            description: Gateway 5xx responses have exceeded 1% for ten minutes. Correlate with authorization sidecar, OPA, upstream, and trace IDs before changing traffic policy.
            runbook_url: https://runbooks.example.com/paymentswitch/apisix-opa-fail-closed
        - alert: PaymentswitchAuthorizationDependencyFailure
          expr: increase(paymentswitch_authz_dependency_failures_total[5m]) > 0
          for: 2m
          labels:
            severity: critical
            service: authorization
            paging: "true"
          annotations:
            summary: Authorization sidecar cannot obtain a valid OPA decision
            description: At least one OPA transport, response, or decision parsing failure occurred. The gateway is denying with 503 by design; inspect OPA mTLS, policy health, and NetworkPolicy.
            runbook_url: https://runbooks.example.com/paymentswitch/apisix-opa-fail-closed
        - alert: PaymentswitchAuthorizationLatencyHigh
          expr: |
            histogram_quantile(0.95,
              sum(rate(paymentswitch_authz_decision_duration_seconds_bucket[5m])) by (le)
            ) > 1
          for: 10m
          labels:
            severity: warning
            service: authorization
          annotations:
            summary: Authorization sidecar p95 latency exceeds one second
            description: APISIX authorization capacity is at risk. Inspect OPA evaluation latency, TLS handshake reuse, DNS, and sidecar CPU saturation.
        - alert: PaymentswitchOpaTargetDown
          expr: up{job=~".*opa.*"} == 0
          for: 2m
          labels:
            severity: critical
            service: opa
            paging: "true"
          annotations:
            summary: OPA metrics target is down
            description: Prometheus cannot scrape an OPA diagnostics target for two minutes. Confirm OPA pod readiness and diagnostics endpoint reachability.
    - name: paymentswitch.payment-api
      rules:
        - alert: PaymentswitchPaymentApiErrorRatioHigh
          expr: |
            sum(rate(paymentswitch_payment_route_requests_total{outcome=~"client_error|denied|dependency_error|server_error"}[5m]))
            / clamp_min(sum(rate(paymentswitch_payment_route_requests_total[5m])), 0.001) > 0.05
          for: 10m
          labels:
            severity: warning
            service: payment-api
          annotations:
            summary: Payment REST API error ratio exceeds five percent
            description: Investigate the operation/outcome dashboard split. Dependency errors require OPA, Permify, workflow, and database checks; denials should be correlated with expected tenant and MFA policy decisions.
        - alert: PaymentswitchPaymentApiDependencyErrors
          expr: increase(paymentswitch_payment_route_requests_total{outcome="dependency_error"}[5m]) > 0
          for: 2m
          labels:
            severity: critical
            service: payment-api
            paging: "true"
          annotations:
            summary: Payment API is failing closed on an authorization or orchestration dependency
            description: One or more payment API requests returned a dependency error. Review traceparent and authorization decision ID to isolate the failed dependency.
        - alert: PaymentswitchPaymentApiMetricsTargetDown
          expr: up{job=~".*paymentswitch.*api.*"} == 0
          for: 5m
          labels:
            severity: warning
            service: payment-api
          annotations:
            summary: Payment API metrics target is down
            description: Prometheus cannot scrape the payment API metrics endpoint. Verify ServiceMonitor labels, service port naming, and pod readiness.
---
apiVersion: v1

          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 7 },
          "options": { "legend": { "calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "targets": [
            { "expr": "histogram_quantile(0.95, sum(rate(paymentswitch_authz_decision_duration_seconds_bucket[5m])) by (le))", "legendFormat": "Authorization sidecar p95", "refId": "A" },
            { "expr": "histogram_quantile(0.99, sum(rate(paymentswitch_authz_decision_duration_seconds_bucket[5m])) by (le))", "legendFormat": "Authorization sidecar p99", "refId": "B" },

name: Daily Payment Assurance

on:
  schedule:
    - cron: '21 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-payment-assurance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-payment-contracts:
    name: Multi-language payment contract verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.4.1'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: payment-core/go-services/go.mod
          cache-dependency-path: payment-core/go-services/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify TypeScript payment and ISO boundaries
        run: |
          pnpm run check
          pnpm exec vitest run server/api/paymentRestRoutes.test.ts server/lib/iso20022.test.ts

      - name: Verify Go money-movement and reconciliation projection controls
        working-directory: payment-core/go-services
        run: go test ./internal/mojaloop/... ./pkg/ledger/... ./internal/reconciliation/... ./internal/tigerbeetle/...

      - name: Verify Rust ledger and RTGS controls
        working-directory: payment-core/rust-services/outbound-ledger
        run: cargo test --lib

      - name: Verify Python settlement and reconciliation controls
        run: |
          python -m py_compile \
            payment-core/services/settlement/main.py \
            payment-core/services/settlement/persistence.py \
            payment-core/services/settlement/routers.py \
            payment-core/services/settlement/reconciliation_worker.py \
            scripts/assurance/validate_multilanguage_settlement_contract.py
          python -m unittest payment-core/services/settlement/test_reconciliation_worker.py
          python scripts/assurance/validate_multilanguage_settlement_contract.py \
            | tee daily-payment-assurance.json

      - name: Validate migration and deployment contracts
        run: |
          test -s drizzle/0051_multilanguage_idempotency_settlement_contract.sql
          test -s drizzle/0052_cross_store_reconciliation_saga.sql
          test -s drizzle/0053_reconciliation_resolution_idempotency_transition.sql
          grep -q 'settlement-reconciliation-worker' deploy/k8s/production/settlement-reconciliation-worker.yaml
          git diff --check

  live-cross-store-partition-recovery:
    name: Live cross-store partition recovery
    needs: verify-payment-contracts
    if: vars.RUN_LIVE_CROSS_STORE_RECOVERY == 'true'
    # This runner must be inside the isolated staging network to resolve private
    # PostgreSQL and apisix-internal.payment-switch.svc.cluster.local over mTLS.
    runs-on: [self-hosted, linux, x64, payment-switch-staging]
    environment: staging
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install recovery test dependencies
        run: pip install asyncpg==0.29.0 httpx==0.25.2

      - name: Materialize reconciliation mTLS files
        env:
          RECONCILIATION_CA_PEM: ${{ secrets.RECONCILIATION_CA_PEM }}
          RECONCILIATION_CLIENT_CERT_PEM: ${{ secrets.RECONCILIATION_CLIENT_CERT_PEM }}
          RECONCILIATION_CLIENT_KEY_PEM: ${{ secrets.RECONCILIATION_CLIENT_KEY_PEM }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/reconciliation-mtls"
          printf '%s' "$RECONCILIATION_CA_PEM" > "$RUNNER_TEMP/reconciliation-mtls/ca.crt"
          printf '%s' "$RECONCILIATION_CLIENT_CERT_PEM" > "$RUNNER_TEMP/reconciliation-mtls/tls.crt"
          printf '%s' "$RECONCILIATION_CLIENT_KEY_PEM" > "$RUNNER_TEMP/reconciliation-mtls/tls.key"
          test -s "$RUNNER_TEMP/reconciliation-mtls/ca.crt"
          test -s "$RUNNER_TEMP/reconciliation-mtls/tls.crt"
          test -s "$RUNNER_TEMP/reconciliation-mtls/tls.key"

      - name: Run real cross-store partition recovery gate
        env:
          CROSS_STORE_INTEGRATION: '1'
          INTEGRATION_POSTGRES_DSN: ${{ secrets.CROSS_STORE_INTEGRATION_POSTGRES_DSN }}
          POSTGRES_HOST: ${{ secrets.CROSS_STORE_POSTGRES_HOST }}
          POSTGRES_DB: ${{ secrets.CROSS_STORE_POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.CROSS_STORE_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.CROSS_STORE_POSTGRES_PASSWORD }}
          RECONCILIATION_PROJECTION_URL: ${{ secrets.RECONCILIATION_PROJECTION_URL }}
          SETTLEMENT_LEDGER_RECONCILIATION_TOKEN: ${{ secrets.SETTLEMENT_LEDGER_RECONCILIATION_TOKEN }}
          SETTLEMENT_LEDGER_CA_FILE: ${{ runner.temp }}/reconciliation-mtls/ca.crt
          SETTLEMENT_LEDGER_CLIENT_CERT_FILE: ${{ runner.temp }}/reconciliation-mtls/tls.crt
          SETTLEMENT_LEDGER_CLIENT_KEY_FILE: ${{ runner.temp }}/reconciliation-mtls/tls.key
          CROSS_STORE_TEST_TRANSFER_ID_128: ${{ secrets.CROSS_STORE_TEST_TRANSFER_ID_128 }}
          CROSS_STORE_TEST_SETTLEMENT_REFERENCE: ${{ secrets.CROSS_STORE_TEST_SETTLEMENT_REFERENCE }}
        run: bash scripts/assurance/run_cross_store_partition_recovery.sh

      - name: Upload live recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-cross-store-recovery-${{ github.run_id }}
          path: .audit/cross-store-partition-recovery-*.log
          if-no-files-found: warn
          retention-days: 365

      - name: Upload assurance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-payment-assurance-${{ github.run_id }}
          path: |
            daily-payment-assurance.json
            drizzle/0051_multilanguage_idempotency_settlement_contract.sql
            drizzle/0052_cross_store_reconciliation_saga.sql
            drizzle/0053_reconciliation_resolution_idempotency_transition.sql
            deploy/k8s/production/go-ledger-reconciliation-projection.yaml
          if-no-files-found: warn
          retention-days: 90

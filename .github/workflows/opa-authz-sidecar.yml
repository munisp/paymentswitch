name: OPA authorization sidecar

on:
  pull_request:
    paths:
      - "deploy/edge/opa-authz-sidecar/**"
      - ".github/workflows/opa-authz-sidecar.yml"
  push:
    branches: [main]
    paths:
      - "deploy/edge/opa-authz-sidecar/**"
      - ".github/workflows/opa-authz-sidecar.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: opa-authz-sidecar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: deploy/edge/opa-authz-sidecar/go.mod
          cache-dependency-path: deploy/edge/opa-authz-sidecar/go.mod
      - name: Test
        working-directory: deploy/edge/opa-authz-sidecar
        run: go test -race ./...
      - name: Vet
        working-directory: deploy/edge/opa-authz-sidecar
        run: go vet ./...
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: deploy/edge/opa-authz-sidecar
          file: deploy/edge/opa-authz-sidecar/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/paymentswitch-opa-authz-sidecar:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable digest
        if: github.event_name == 'push'
        run: |
          test -n "${{ steps.build.outputs.digest }}"
          printf '%s\n' "${{ steps.build.outputs.digest }}" > opa-authz-sidecar-digest.txt
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: opa-authz-sidecar-digest
          path: opa-authz-sidecar-digest.txt
          if-no-files-found: error
          retention-days: 30

name: payment_switch
description: Payment Switch Platform - Cross-platform mobile application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.0
  flutter_riverpod: ^2.4.0
  go_router: ^12.0.0
  flutter_secure_storage: ^9.0.0
  flutter_appauth: ^8.0.1
  local_auth: ^2.1.8
  connectivity_plus: ^5.0.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.19.0
  flutter_svg: ^2.0.9
  qr_flutter: ^4.1.0
  share_plus: ^7.2.1
  url_launcher: ^6.2.1
  cached_network_image: ^3.3.0
  fl_chart: ^0.65.0
  shimmer: ^3.0.0
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

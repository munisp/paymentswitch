version: '3.8'

services:
  # Temporal Server
  temporal:
    image: temporalio/auto-setup:latest
    container_name: temporal
    ports:
      - "7233:7233"
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
    depends_on:
      - postgresql
    networks:
      - payment-switch-network

  # Temporal UI
  temporal-ui:
    image: temporalio/ui:latest
    container_name: temporal-ui
    ports:
      - "8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal
    networks:
      - payment-switch-network

  # PostgreSQL for Temporal
  postgresql:
    image: postgres:15
    container_name: temporal-postgresql
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    networks:
      - payment-switch-network

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - payment-switch-network

  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - payment-switch-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - payment-switch-network

  # Keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    ports:
      - "8081:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
    command: start-dev
    depends_on:
      - keycloak-db
    networks:
      - payment-switch-network

  # PostgreSQL for Keycloak
  keycloak-db:
    image: postgres:15
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    networks:
      - payment-switch-network

  # Permify
  permify:
    image: ghcr.io/permify/permify:latest
    container_name: permify
    ports:
      - "3476:3476"
      - "3478:3478"
    command: serve
    environment:
      - PERMIFY_DATABASE_ENGINE=postgres
      - PERMIFY_DATABASE_URI=postgres://permify:permify@permify-db:5432/permify?sslmode=disable
    depends_on:
      - permify-db
    networks:
      - payment-switch-network

  # PostgreSQL for Permify
  permify-db:
    image: postgres:15
    container_name: permify-db
    environment:
      POSTGRES_DB: permify
      POSTGRES_USER: permify
      POSTGRES_PASSWORD: permify
    volumes:
      - permify-postgres-data:/var/lib/postgresql/data
    networks:
      - payment-switch-network

  # APISIX
  apisix:
    image: apache/apisix:latest
    container_name: apisix
    ports:
      - "9080:9080"
      - "9180:9180"
      - "9443:9443"
    volumes:
      - ../config/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    depends_on:
      - etcd
    networks:
      - payment-switch-network

  # etcd for APISIX
  etcd:
    image: bitnami/etcd:latest
    container_name: etcd
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
    ports:
      - "2379:2379"
    networks:
      - payment-switch-network

  # Dapr Placement Service
  dapr-placement:
    image: daprio/dapr:latest
    container_name: dapr-placement
    command: ["./placement", "-port", "50006"]
    ports:
      - "50006:50006"
    networks:
      - payment-switch-network

  # Go Worker
  go-worker:
    build:
      context: ./workers/go
      dockerfile: Dockerfile
    container_name: go-worker
    environment:
      - TEMPORAL_HOST=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TASK_QUEUE=payment-switch
      - DATABASE_URL=${DATABASE_URL}
      - KAFKA_BROKERS=kafka:9092
      - REDIS_HOST=redis:6379
      - DAPR_HOST=localhost
      - DAPR_PORT=3500
      - KEYCLOAK_URL=http://keycloak:8080
      - PERMIFY_HOST=permify
      - PERMIFY_PORT=3476
    depends_on:
      - temporal
      - kafka
      - redis
      - keycloak
      - permify
    networks:
      - payment-switch-network

  # Python Worker
  python-worker:
    build:
      context: ./workers/python
      dockerfile: Dockerfile
    container_name: python-worker
    environment:
      - TEMPORAL_HOST=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - PYTHON_TASK_QUEUE=python-workers
    depends_on:
      - temporal
    networks:
      - payment-switch-network

volumes:
  temporal-postgres-data:
  keycloak-postgres-data:
  permify-postgres-data:
  redis-data:

networks:
  payment-switch-network:
    driver: bridge

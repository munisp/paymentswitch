version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: remittance-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-remittance_pass}
      POSTGRES_DB: ${DB_NAME:-remittance}
      POSTGRES_USER: ${DB_USER:-remittance_user}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - remittance-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-remittance_user} -d ${DB_NAME:-remittance}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (for rate limiting and session storage)
  redis:
    image: redis:7-alpine
    container_name: remittance-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - remittance-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application Server
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: remittance-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${DB_USER:-remittance_user}:${DB_PASSWORD:-remittance_pass}@db:5432/${DB_NAME:-remittance}
      REDIS_URL: redis://redis:6379
      
      # JWT & Auth
      JWT_SECRET: ${JWT_SECRET}
      OAUTH_SERVER_URL: ${OAUTH_SERVER_URL}
      
      # Coinbase Commerce
      COINBASE_API_KEY: ${COINBASE_API_KEY}
      COINBASE_WEBHOOK_SECRET: ${COINBASE_WEBHOOK_SECRET}
      
      # Circle USDC
      CIRCLE_API_URL: ${CIRCLE_API_URL:-https://api.circle.com/v1}
      CIRCLE_API_KEY: ${CIRCLE_API_KEY}
      CIRCLE_MERCHANT_WALLET_ID: ${CIRCLE_MERCHANT_WALLET_ID}
      
      # NIBSS Banking
      NIBSS_API_URL: ${NIBSS_API_URL}
      NIBSS_API_KEY: ${NIBSS_API_KEY}
      NIBSS_INSTITUTION_CODE: ${NIBSS_INSTITUTION_CODE}
      NIBSS_SOURCE_ACCOUNT: ${NIBSS_SOURCE_ACCOUNT}
      
      # Smile Identity KYC
      SMILE_API_URL: ${SMILE_API_URL:-https://api.smileidentity.com/v1}
      SMILE_PARTNER_ID: ${SMILE_PARTNER_ID}
      SMILE_API_KEY: ${SMILE_API_KEY}
      SMILE_CALLBACK_URL: ${SMILE_CALLBACK_URL}
      
      # Paga Agent Cash
      PAGA_API_KEY: ${PAGA_API_KEY}
      PAGA_MERCHANT_KEY: ${PAGA_MERCHANT_KEY}
      
      # OPay Agent Cash
      OPAY_API_KEY: ${OPAY_API_KEY}
      OPAY_MERCHANT_ID: ${OPAY_MERCHANT_ID}
      
      # Kudi Agent Cash
      KUDI_API_KEY: ${KUDI_API_KEY}
      
      # Quickteller Bill Payment
      QUICKTELLER_API_KEY: ${QUICKTELLER_API_KEY}
      QUICKTELLER_MERCHANT_ID: ${QUICKTELLER_MERCHANT_ID}
      
      # SMS Provider (Twilio/Africa's Talking)
      SMS_PROVIDER: ${SMS_PROVIDER:-twilio}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      
      # Monitoring & Logging
      SENTRY_DSN: ${SENTRY_DSN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./logs:/app/logs
    networks:
      - remittance-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy (optional, for production)
  nginx:
    image: nginx:alpine
    container_name: remittance-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - remittance-network
    profiles:
      - production

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  remittance-network:
    driver: bridge

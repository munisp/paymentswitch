---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: kyc-service-scaler
  namespace: payment-switch
  labels:
    app: kyc-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kyc-service
  minReplicaCount: 2
  maxReplicaCount: 10
  pollingInterval: 30
  cooldownPeriod: 120
  triggers:
    - type: redis
      metadata:
        address: redis-master.payment-switch.svc:6379
        listName: kyc:pending
        listLength: "10"
        activationListLength: "1"
      authenticationRef:
        name: redis-auth
---

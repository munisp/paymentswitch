# KEDA ScaledObjects for Kafka consumer auto-scaling
# Scales based on consumer group lag — pods scale up when messages accumulate
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: kafka-auth
  namespace: payment-switch
spec:
  secretTargetRef:
    - parameter: sasl
      name: kafka-credentials
      key: mechanism
    - parameter: username
      name: kafka-credentials
      key: username
    - parameter: password
      name: kafka-credentials
      key: password
    - parameter: tls
      name: kafka-credentials
      key: ca-cert
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: redis-auth
  namespace: payment-switch
spec:
  secretTargetRef:
    - parameter: password
      name: redis-credentials
      key: password
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: payment-gateway-scaler
  namespace: payment-switch
  labels:
    app: payment-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payment-gateway
  minReplicaCount: 3
  maxReplicaCount: 50
  pollingInterval: 15
  cooldownPeriod: 60
  advanced:
    restoreToOriginalReplicaCount: true
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          selectPolicy: Max
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
            - type: Pods
              value: 10
              periodSeconds: 15
        scaleDown:
          stabilizationWindowSeconds: 300
          selectPolicy: Min
          policies:
            - type: Percent
              value: 10
              periodSeconds: 60
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka-0.kafka-headless:9092,kafka-1.kafka-headless:9092,kafka-2.kafka-headless:9092
        consumerGroup: payment-gateway-group
        topic: payment.transfers
        lagThreshold: "100"
        activationLagThreshold: "10"
        offsetResetPolicy: latest
      authenticationRef:
        name: kafka-auth
    - type: cpu
      metadata:
        type: Utilization
        value: "70"
    - type: memory
      metadata:
        type: Utilization
        value: "80"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: fraud-detection-scaler
  namespace: payment-switch
  labels:
    app: fraud-detection
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fraud-detection
  minReplicaCount: 2
  maxReplicaCount: 30
  pollingInterval: 10
  cooldownPeriod: 60
  advanced:
    restoreToOriginalReplicaCount: true
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          selectPolicy: Max
          policies:
            - type: Percent
              value: 200
              periodSeconds: 10
        scaleDown:
          stabilizationWindowSeconds: 300
          selectPolicy: Min
          policies:
            - type: Percent
              value: 10
              periodSeconds: 60
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka-0.kafka-headless:9092,kafka-1.kafka-headless:9092,kafka-2.kafka-headless:9092
        consumerGroup: fraud-detection-group
        topic: transaction-events
        lagThreshold: "50"
        activationLagThreshold: "5"
        offsetResetPolicy: latest
      authenticationRef:
        name: kafka-auth
    - type: cpu
      metadata:
        type: Utilization
        value: "60"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: data-pipeline-scaler
  namespace: payment-switch
  labels:
    app: data-pipeline
spec:
  scaleTargetRef:
    apiVersion: apps/v1

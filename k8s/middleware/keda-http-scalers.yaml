# KEDA ScaledObjects for HTTP services — scale on request rate via Prometheus
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: mojaloop-service-scaler
  namespace: payment-switch
  labels:
    app: mojaloop-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mojaloop-service
  minReplicaCount: 3
  maxReplicaCount: 30
  pollingInterval: 15
  cooldownPeriod: 60
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring.svc:9090
        metricName: mojaloop_transfers_per_second
        query: sum(rate(http_requests_total{app="mojaloop-service"}[1m]))
        threshold: "500"
        activationThreshold: "50"
    - type: cpu
      metadata:
        type: Utilization
        value: "70"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: payment-switch-api-scaler
  namespace: payment-switch
  labels:
    app: payment-switch-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payment-switch-api
  minReplicaCount: 3
  maxReplicaCount: 20
  pollingInterval: 15
  cooldownPeriod: 60
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 30
          selectPolicy: Max
          policies:
            - type: Percent
              value: 50
              periodSeconds: 30
        scaleDown:
          stabilizationWindowSeconds: 300
          selectPolicy: Min
          policies:
            - type: Percent
              value: 25
              periodSeconds: 120
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring.svc:9090
        metricName: api_requests_per_second
        query: sum(rate(http_requests_total{app="payment-switch-api"}[1m]))
        threshold: "1000"
        activationThreshold: "100"
    - type: cpu
      metadata:
        type: Utilization
        value: "70"
    - type: memory
      metadata:
        type: Utilization
        value: "80"
---

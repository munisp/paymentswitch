---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-ledger
  namespace: payment-switch
  labels:
    app: go-ledger
    tier: core
spec:
  replicas: 3
  selector:
    matchLabels:
      app: go-ledger
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: go-ledger
        tier: core
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      terminationGracePeriodSeconds: 30
      serviceAccountName: payment-switch-sa
      containers:
        - name: go-ledger
          image: registry.paymentswitch.ng/go-ledger:latest
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: TIGERBEETLE_CLUSTER_ID
              value: "0"
            - name: TIGERBEETLE_ADDRESSES
              value: "tigerbeetle-0:3001,tigerbeetle-1:3001,tigerbeetle-2:3001"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
          livenessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 2Gi
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]

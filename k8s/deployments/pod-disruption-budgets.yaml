# PodDisruptionBudgets — ensure minimum availability during voluntary disruptions
# (node drains, cluster upgrades, rollouts)
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payment-gateway-pdb
  namespace: payment-switch
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: payment-gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mojaloop-service-pdb
  namespace: payment-switch
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: mojaloop-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: go-ledger-pdb
  namespace: payment-switch
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: go-ledger
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payment-switch-api-pdb
  namespace: payment-switch
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: payment-switch-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: settlement-engine-pdb
  namespace: payment-switch
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: settlement-engine
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fraud-detection-pdb
  namespace: payment-switch
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: fraud-detection
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sanctions-screening-pdb
  namespace: payment-switch
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: sanctions-screening

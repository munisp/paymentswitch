# K8s Services — ClusterIP for internal service discovery
---
apiVersion: v1
kind: Service
metadata:
  name: mojaloop-service
  namespace: payment-switch
  labels:
    app: mojaloop-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  selector:
    app: mojaloop-service
---

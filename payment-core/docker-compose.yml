version: '3.8'

services:
  # ============================================================================
  # DATABASE SERVICES
  # ============================================================================
  
  postgres:
    image: postgres:15-alpine
    container_name: payment-switch-postgres
    environment:
      POSTGRES_DB: payment_switch
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_pass_2024
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_user -d payment_switch"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - payment-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: payment-switch-redis
    command: redis-server --appendonly yes --requirepass redis_pass_2024
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - payment-network
    restart: unless-stopped

  # ============================================================================
  # TEMPORAL WORKFLOW ENGINE
  # ============================================================================
  
  temporal:
    image: temporalio/auto-setup:1.22.0
    container_name: payment-switch-temporal
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=payment_user
      - POSTGRES_PWD=payment_pass_2024
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - payment-network
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.21.0
    container_name: payment-switch-temporal-ui
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      - temporal
    networks:
      - payment-network
    restart: unless-stopped

  # ============================================================================
  # PAYMENT SWITCH SERVICES
  # ============================================================================
  
  payment-gateway:
    build:
      context: .
      dockerfile: services/payment-gateway/Dockerfile
    container_name: payment-gateway
    environment:
      - DATABASE_URL=postgresql://payment_user:payment_pass_2024@postgres:5432/payment_switch
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis_pass_2024
      - TEMPORAL_HOST=temporal:7233
      - SERVICE_PORT=8001
      - LOG_LEVEL=INFO
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
    networks:
      - payment-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/payments/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  fraud-detection-service:
    build:
      context: .
      dockerfile: services/fraud-detection-service/Dockerfile
    container_name: fraud-detection-service
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis_pass_2024
      - SERVICE_PORT=8002
      - LOG_LEVEL=INFO
      - MODEL_PATH=/app/models
    ports:
      - "8002:8002"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - fraud_models:/app/models
    networks:
      - payment-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/api/v1/fraud/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  settlement-service:
    build:
      context: .
      dockerfile: services/settlement/Dockerfile
    container_name: settlement-service
    environment:
      - DATABASE_URL=postgresql://payment_user:payment_pass_2024@postgres:5432/payment_switch
      - SERVICE_PORT=8003
      - LOG_LEVEL=INFO
      - MOJALOOP_SETTLEMENT_URL=${MOJALOOP_SETTLEMENT_URL:?MOJALOOP_SETTLEMENT_URL must point to a reachable settlement service}
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - payment-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/api/v1/settlement/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  offline-payments-service:
    build:
      context: .
      dockerfile: services/offline-payments/Dockerfile
    container_name: offline-payments-service
    environment:
      - DATABASE_URL=postgresql://payment_user:payment_pass_2024@postgres:5432/payment_switch
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis_pass_2024
      - SERVICE_PORT=8004
      - LOG_LEVEL=INFO
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - payment-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/api/v1/offline/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  fraud-detection:
    build:
      context: .
      dockerfile: services/fraud-detection/Dockerfile
    container_name: fraud-detection
    environment:
      - DATABASE_URL=postgresql://payment_user:payment_pass_2024@postgres:5432/payment_switch
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis_pass_2024
      - SERVICE_PORT=8005
      - LOG_LEVEL=INFO
    ports:
      - "8005:8005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - payment-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/api/v1/fraud/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # MONITORING & OBSERVABILITY
  # ============================================================================
  
  prometheus:
    image: prom/prometheus:latest
    container_name: payment-switch-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    networks:
      - payment-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: payment-switch-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin_2024
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deployment/kubernetes/monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - payment-network
    restart: unless-stopped

  # ============================================================================
  # API GATEWAY (NGINX)
  # ============================================================================
  
  nginx:
    image: nginx:alpine
    container_name: payment-switch-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - payment-gateway
      - fraud-detection-service
      - settlement-service
      - offline-payments-service
      - fraud-detection
    networks:
      - payment-network
    restart: unless-stopped

# ============================================================================
# NETWORKS
# ============================================================================

networks:
  payment-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ============================================================================
# VOLUMES
# ============================================================================

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  fraud_models:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

  notification-service:
    build: ./services/notification-service
    ports:
      - "8006:8000"
    depends_on:
      - postgres
      - redis

  batch-processing-service:
    build: ./services/batch-processing-service
    ports:
      - "8007:8000"
    depends_on:
      - postgres
      - redis

  qr-code-service:
    build: ./services/qr-code-service
    ports:
      - "8008:8000"
    depends_on:
      - postgres

  social-graph-service:
    build: ./services/social-graph-service
    ports:
      - "8009:8000"
    depends_on:
      - postgres

  pos-service:
    build: ./services/pos-service
    ports:
      - "8010:8000"
    depends_on:
      - postgres

  p2p-service:
    build: ./services/p2p-service
    ports:
      - "8011:8000"
    depends_on:
      - postgres
      - tigerbeetle

  subscription-service:
    build: ./services/subscription-service
    ports:
      - "8012:8000"
    depends_on:
      - postgres

  invoicing-service:
    build: ./services/invoicing-service
    ports:
      - "8013:8000"
    depends_on:
      - postgres

  erp-integration-service:
    build: ./services/erp-integration-service
    ports:
      - "8014:8000"
    depends_on:
      - postgres

  approval-workflow-service:
    build: ./services/approval-workflow-service
    ports:
      - "8015:8000"
    depends_on:
      - postgres
      - temporal

  payroll-service:
    build: ./services/payroll-service
    ports:
      - "8016:8000"
    depends_on:
      - postgres

  corporate-onboarding-service:
    build: ./services/corporate-onboarding-service
    ports:
      - "8017:8000"
    depends_on:
      - postgres

  advanced-analytics-service:
    build: ./services/advanced-analytics-service
    ports:
      - "8018:8000"
    depends_on:
      - postgres

[package]
name = "transaction-pipeline"
version = "1.0.0"
edition = "2021"
description = "Zero-copy, SIMD-optimized transaction processing pipeline for millions of TPS"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "pipeline_bench"
harness = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"

---
# Enhanced OpenCTI Deployment with Wazuh Integration

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: opencti-wazuh-credentials
  namespace: security
  labels:
    app: opencti
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: opencti-wazuh-credentials
    creationPolicy: Owner
  data:
    - secretKey: OPENCTI_URL
      remoteRef: { key: payment-switch/security/opencti, property: api_url }
    - secretKey: OPENCTI_TOKEN
      remoteRef: { key: payment-switch/security/opencti, property: api_token }
    - secretKey: OPENCTI_ADMIN_EMAIL
      remoteRef: { key: payment-switch/security/opencti, property: admin_email }
    - secretKey: OPENCTI_ADMIN_PASSWORD
      remoteRef: { key: payment-switch/security/opencti, property: admin_password }
    - secretKey: OPENCTI_ADMIN_TOKEN
      remoteRef: { key: payment-switch/security/opencti, property: admin_token }

---
# ConfigMap for enhanced Wazuh integration script
apiVersion: v1
kind: ConfigMap
metadata:
  name: wazuh-opencti-integration-enhanced
  namespace: security
  labels:
    app: wazuh
    component: integration
data:
  wazuh_opencti_integration_enhanced.py: |
    #!/usr/bin/env python3
    # Enhanced Wazuh-OpenCTI Integration Script
    # (Content from the enhanced script file)
    
  requirements.txt: |
    pycti==5.12.0
    requests==2.31.0
    python-dateutil==2.8.2

---
# Job to initialize OpenCTI with Wazuh-specific configuration
apiVersion: batch/v1
kind: Job
metadata:
  name: opencti-wazuh-init
  namespace: security
  labels:
    app: opencti
    component: init
spec:
  template:
    metadata:
      labels:
        app: opencti
        component: init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: opencti-init
          image: python:3.11-slim
          command:
            - /bin/bash
            - -c
            - |
              pip3 install pycti requests
              python3 /scripts/init_opencti.py
          env:
            - name: OPENCTI_URL
              valueFrom:
                secretKeyRef:
                  name: opencti-wazuh-credentials
                  key: OPENCTI_URL
            - name: OPENCTI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: opencti-wazuh-credentials
                  key: OPENCTI_ADMIN_TOKEN
          volumeMounts:
            - name: init-script
              mountPath: /scripts
            - name: incident-types
              mountPath: /config/incident-types.json
              subPath: incident-types.json
            - name: labels
              mountPath: /config/labels.json
              subPath: labels.json
      volumes:
        - name: init-script
          configMap:
            name: opencti-init-script
        - name: incident-types
          configMap:
            name: opencti-wazuh-incident-types
        - name: labels
          configMap:
            name: opencti-wazuh-labels

---
# ConfigMap for OpenCTI initialization script
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencti-init-script
  namespace: security
  labels:
    app: opencti
    component: init
data:
  init_opencti.py: |
    #!/usr/bin/env python3
    """
    Initialize OpenCTI with Wazuh-specific configuration
    """
    import os
    import json
    import time
    from pycti import OpenCTIApiClient
    
    OPENCTI_URL = os.getenv('OPENCTI_URL')
    OPENCTI_TOKEN = os.getenv('OPENCTI_TOKEN')
    
    print(f"Connecting to OpenCTI at {OPENCTI_URL}")
    
    # Wait for OpenCTI to be ready
    max_retries = 30
    for i in range(max_retries):
        try:
            client = OpenCTIApiClient(OPENCTI_URL, OPENCTI_TOKEN)
            print("Successfully connected to OpenCTI")
            break
        except Exception as e:
            print(f"Waiting for OpenCTI to be ready... ({i+1}/{max_retries})")
            time.sleep(10)
    else:
        print("Failed to connect to OpenCTI after maximum retries")
        exit(1)
    
    # Load incident types
    print("Creating incident types...")
    with open('/config/incident-types.json', 'r') as f:
        incident_types_config = json.load(f)
    
    for incident_type_data in incident_types_config['incident_types']:
        try:
            # Check if incident type exists
            existing = client.incident_type.list(
                filters=[{'key': 'name', 'values': [incident_type_data['name']]}]
            )
            
            if not existing:
                client.incident_type.create(
                    name=incident_type_data['name'],
                    description=incident_type_data['description']
                )
                print(f"Created incident type: {incident_type_data['name']}")
            else:
                print(f"Incident type already exists: {incident_type_data['name']}")
        except Exception as e:
            print(f"Error creating incident type {incident_type_data['name']}: {e}")
    
    # Load labels
    print("Creating labels...")
    with open('/config/labels.json', 'r') as f:
        labels_config = json.load(f)
    
    for label_data in labels_config['labels']:
        try:
            # Check if label exists
            existing = client.label.list(
                filters=[{'key': 'value', 'values': [label_data['value']]}]
            )
            
            if not existing:
                client.label.create(
                    value=label_data['value'],
                    color=label_data['color']
                )
                print(f"Created label: {label_data['value']}")
            else:
                print(f"Label already exists: {label_data['value']}")
        except Exception as e:
            print(f"Error creating label {label_data['value']}: {e}")
    
    print("OpenCTI initialization completed successfully")

---
# Updated Wazuh Manager StatefulSet with enhanced integration
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-manager-enhanced
  namespace: security
  labels:
    app: wazuh
    component: manager
spec:
  serviceName: wazuh-manager
  replicas: 1
  selector:
    matchLabels:
      app: wazuh
      component: manager
  template:
    metadata:
      labels:
        app: wazuh
        component: manager
    spec:
      serviceAccountName: wazuh
      
      initContainers:
        - name: install-dependencies
          image: wazuh/wazuh-manager:4.7.0
          command:
            - /bin/sh
            - -c
            - |
              apt-get update
              apt-get install -y python3-pip
              pip3 install pycti==5.12.0 requests==2.31.0 python-dateutil==2.8.2
          volumeMounts:
            - name: python-packages
              mountPath: /usr/local/lib/python3.9/dist-packages
      
      containers:
        - name: wazuh-manager
          image: wazuh/wazuh-manager:4.7.0
          imagePullPolicy: IfNotPresent
          
          ports:
            - name: registration
              containerPort: 1515
            - name: cluster
              containerPort: 1516
            - name: api
              containerPort: 55000
            - name: syslog-tcp
              containerPort: 514
              protocol: TCP
            - name: syslog-udp
              containerPort: 514
              protocol: UDP
          
          env:
            - name: OPENCTI_URL
              valueFrom:
                secretKeyRef:
                  name: opencti-wazuh-credentials
                  key: OPENCTI_URL
            - name: OPENCTI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: opencti-wazuh-credentials
                  key: OPENCTI_TOKEN
          
          resources:
            requests:
              cpu: 2000m
              memory: 4Gi
            limits:
              cpu: 4000m
              memory: 8Gi
          
          livenessProbe:
            exec:
              command:
                - /var/ossec/bin/wazuh-control
                - status
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
          
          readinessProbe:
            exec:
              command:
                - /var/ossec/bin/wazuh-control
                - status
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
          
          volumeMounts:
            - name: config
              mountPath: /wazuh-config-mount/etc/ossec.conf
              subPath: ossec.conf
            - name: go-ledger-decoder
              mountPath: /var/ossec/etc/decoders/go-ledger-decoder.xml
              subPath: go-ledger-decoder.xml
            - name: go-ledger-rules
              mountPath: /var/ossec/etc/rules/go-ledger-rules.xml
              subPath: go-ledger-rules.xml
            - name: workflow-decoder
              mountPath: /var/ossec/etc/decoders/workflow-orchestrator-decoder.xml
              subPath: workflow-orchestrator-decoder.xml
            - name: workflow-rules
              mountPath: /var/ossec/etc/rules/workflow-orchestrator-rules.xml
              subPath: workflow-orchestrator-rules.xml
            - name: integration-script
              mountPath: /var/ossec/integrations/wazuh_opencti_integration.py
              subPath: wazuh_opencti_integration_enhanced.py
            - name: python-packages
              mountPath: /usr/local/lib/python3.9/dist-packages
            - name: data
              mountPath: /var/ossec/data
            - name: logs
              mountPath: /var/ossec/logs
      
      volumes:
        - name: config
          configMap:
            name: wazuh-manager-ossec-config
        - name: go-ledger-decoder
          configMap:
            name: wazuh-go-ledger-decoder
        - name: go-ledger-rules
          configMap:
            name: wazuh-go-ledger-rules
        - name: workflow-decoder
          configMap:
            name: wazuh-workflow-orchestrator-decoder
        - name: workflow-rules
          configMap:
            name: wazuh-workflow-orchestrator-rules
        - name: integration-script
          configMap:
            name: wazuh-opencti-integration-enhanced
            defaultMode: 0755
        - name: python-packages
          emptyDir: {}
  
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 100Gi
    - metadata:
        name: logs
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 50Gi

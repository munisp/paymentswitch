---
# OpenCTI External References Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencti-external-references
  namespace: security
  labels:
    app: opencti
    component: config
data:
  external-references.json: |
    {
      "external_references": [
        {
          "source_name": "Wazuh SIEM",
          "description": "Wazuh Security Information and Event Management",
          "url": "https://wazuh.com"
        },
        {
          "source_name": "MITRE ATT&CK",
          "description": "MITRE ATT&CK Framework",
          "url": "https://attack.mitre.org"
        },
        {
          "source_name": "PCI DSS",
          "description": "Payment Card Industry Data Security Standard",
          "url": "https://www.pcisecuritystandards.org"
        }
      ]
    }

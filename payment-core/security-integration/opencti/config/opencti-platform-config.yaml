---
# OpenCTI Platform Configuration for Wazuh Integration
# This configuration should be added to the OpenCTI platform deployment

apiVersion: v1
kind: ConfigMap
metadata:
  name: opencti-platform-config
  namespace: security
  labels:
    app: opencti
    component: platform
data:
  production.json: |
    {
      "app": {
        "port": 8080,
        "base_path": "",
        "base_url": "http://opencti-platform.security.svc.cluster.local:8080",
        "request_timeout": 300000,
        "session_timeout": 1200000,
        "session_idle_timeout": 0,
        "session_cookie": false,
        "admin": {
          "email": "admin@opencti.io"
        }
      },
      "rule_engine": {
        "enabled": true,
        "lock_key": "rule_engine_lock"
      },
      "subscription_scheduler": {
        "enabled": true,
        "lock_key": "subscription_scheduler_lock",
        "interval": 10000
      },
      "expiration_scheduler": {
        "enabled": true,
        "lock_key": "expiration_scheduler_lock",
        "interval": 300000
      },
      "task_scheduler": {
        "enabled": true,
        "lock_key": "task_manager_lock",
        "interval": 10000
      },
      "sync_manager": {
        "enabled": true,
        "lock_key": "sync_manager_lock",
        "interval": 10000
      },
      "ingestion_manager": {
        "enabled": true,
        "lock_key": "ingestion_manager_lock"
      },
      "elasticsearch": {
        "engine_selector": "auto",
        "url": "http://elasticsearch.security.svc.cluster.local:9200",
        "index_prefix": "opencti",
        "username": "",
        "password": "",
        "ssl": {
          "reject_unauthorized": true
        }
      },
      "redis": {
        "mode": "single",
        "namespace": "",
        "hostname": "redis.security.svc.cluster.local",
        "port": 6379,
        "use_ssl": false,
        "username": "",
        "password": "",
        "ca": [],
        "trimming": 2000000
      },
      "rabbitmq": {
        "hostname": "rabbitmq.security.svc.cluster.local",
        "port": 5672,
        "port_management": 15672,
        "username": "guest",
        "password": "guest",
        "queue_type": "classic",
        "use_ssl": false,
        "use_ssl_cert": "",
        "use_ssl_key": "",
        "use_ssl_pfx": "",
        "use_ssl_ca": [],
        "use_ssl_passphrase": "",
        "use_ssl_reject_unauthorized": true,
        "management_ssl": false
      },
      "providers": {
        "local": {
          "strategy": "LocalStrategy"
        }
      },
      "minio": {
        "endpoint": "minio.security.svc.cluster.local",
        "port": 9000,
        "use_ssl": false,
        "access_key": "minioadmin",
        "secret_key": "minioadmin",
        "bucket_name": "opencti-bucket",
        "bucket_region": "us-east-1"
      }
    }

---
# OpenCTI Wazuh Incident Type Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencti-wazuh-incident-types
  namespace: security
  labels:
    app: opencti
    component: config
data:
  incident-types.json: |
    {
      "incident_types": [
        {
          "name": "Wazuh Security Alert",
          "description": "Security alert generated by Wazuh SIEM",
          "color": "#ff5722"
        },
        {
          "name": "Authentication Failure",
          "description": "Multiple authentication failures detected",
          "color": "#f44336"
        },
        {
          "name": "Unauthorized Execution",
          "description": "Unauthorized workflow or operation execution attempt",
          "color": "#e91e63"
        },
        {
          "name": "Privilege Escalation",
          "description": "Privilege escalation attempt detected",
          "color": "#9c27b0"
        },
        {
          "name": "API Abuse",
          "description": "API key abuse or invalid API key attempts",
          "color": "#673ab7"
        },
        {
          "name": "DoS Attack",
          "description": "Denial of Service attack detected",
          "color": "#3f51b5"
        },
        {
          "name": "Fraud Detection",
          "description": "Fraudulent transaction pattern detected",
          "color": "#2196f3"
        },
        {
          "name": "Data Exfiltration",
          "description": "Potential data exfiltration attempt",
          "color": "#03a9f4"
        }
      ]
    }

---
# OpenCTI Labels for Wazuh Alerts
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencti-wazuh-labels
  namespace: security
  labels:
    app: opencti
    component: config
data:
  labels.json: |
    {
      "labels": [
        {
          "value": "wazuh-alert",
          "color": "#ff5722"
        },
        {
          "value": "go-ledger",
          "color": "#4caf50"
        },
        {
          "value": "workflow-orchestrator",
          "color": "#2196f3"
        },
        {
          "value": "payment-switch",
          "color": "#9c27b0"
        },
        {
          "value": "critical",
          "color": "#f44336"
        },
        {
          "value": "high",
          "color": "#ff9800"
        },
        {
          "value": "medium",
          "color": "#ffc107"
        },
        {
          "value": "low",
          "color": "#8bc34a"
        },
        {

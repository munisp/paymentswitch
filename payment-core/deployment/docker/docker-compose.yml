version: '3.8'

services:
  # Infrastructure Services
  
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    command: redis-server --requirepass payment-switch-redis
    volumes:
      - redis-data:/data

  postgresql:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    ports:
      - "5432:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql/data

  mojaloop-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: central_ledger
      POSTGRES_USER: mojaloop
    ports:
      - "5433:5432"
    volumes:
      - mojaloop-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mojaloop -d central_ledger"]
      interval: 10s
      timeout: 5s
      retries: 5

  etcd:
    image: quay.io/coreos/etcd:v3.5.10
    environment:
      ETCD_NAME: etcd0
      ETCD_INITIAL_CLUSTER: etcd0=http://etcd:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: apisix-etcd-cluster
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - etcd-data:/var/lib/etcd

  # Core Services

  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:latest
    command: start --addresses=0.0.0.0:3000 --cluster=0 --replica=0 /var/lib/tigerbeetle/data.tigerbeetle
    ports:
      - "3000:3000"
    volumes:
      - tigerbeetle-data:/var/lib/tigerbeetle

  temporal:
    image: temporalio/auto-setup:1.22.0
    depends_on:
      - postgresql
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgresql
    ports:
      - "7233:7233"
      - "7234:7234"
      - "7235:7235"
      - "7239:7239"

  temporal-ui:
    image: temporalio/ui:2.21.0
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8080:8080"

  apisix:
    image: apache/apisix:3.7.0-debian
    depends_on:
      - etcd
    ports:
      - "9080:9080"
      - "9443:9443"
      - "9091:9091"
    environment:
      APISIX_STAND_ALONE: "false"
    volumes:
      - ../../../config/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro

  # Application Services

  payment-gateway:
    build:
      context: ../../services/payment-gateway
      dockerfile: Dockerfile
    depends_on:
      - redis
      - temporal
      - kafka
    environment:
      TEMPORAL_HOST: temporal:7233
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TIGERBEETLE_HOST: tigerbeetle
      TIGERBEETLE_PORT: 3000
    ports:
      - "8000:8000"

  workflow-orchestrator:
    build:
      context: ../../services/workflow-orchestrator
      dockerfile: Dockerfile
    depends_on:
      - temporal
      - kafka
    environment:
      TEMPORAL_HOST: temporal:7233

  fraud-detection:
    build:
      context: ../../services/fraud-detection
      dockerfile: Dockerfile
    depends_on:
      - redis
      - kafka
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8001:8001"

  settlement:
    build:
      context: ../../services/settlement
      dockerfile: Dockerfile
    depends_on:
      - mojaloop-postgres
      - kafka
    environment:
      MOJALOOP_SETTLEMENT_URL: ${MOJALOOP_SETTLEMENT_URL:?MOJALOOP_SETTLEMENT_URL must point to a reachable settlement service}
      TIGERBEETLE_HOST: tigerbeetle
    ports:
      - "8002:8002"

  # Monitoring & Security

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    environment:
      discovery.type: single-node
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_SECURITY_PLUGIN: "true"
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.0
    depends_on:
      - opensearch
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ../../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:latest
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  zookeeper-data:
  kafka-data:
  redis-data:
  postgresql-data:
  mojaloop-postgres-data:
  etcd-data:
  tigerbeetle-data:
  opensearch-data:
  prometheus-data:
  grafana-data:

---
# Optimized Kubernetes Deployments for 20B Transactions/Month
# High Availability and Performance Configuration

# ============================================================================
# PAYMENT GATEWAY SERVICE (Optimized)
# ============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-gateway
  namespace: payment-switch

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-gateway-config
  namespace: payment-switch
data:
  TEMPORAL_HOST: "temporal-frontend.payment-switch:7233"
  REDIS_HOST: "redis-master.payment-switch"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.payment-switch:9092"
  TIGERBEETLE_HOST: "tigerbeetle.payment-switch"
  POSTGRES_HOST: "postgresql.payment-switch"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "payment_switch"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-gateway
  namespace: payment-switch
  labels:
    app: payment-gateway
    version: v2
spec:
  replicas: 50
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 10%
  selector:
    matchLabels:
      app: payment-gateway
  template:
    metadata:
      labels:
        app: payment-gateway
        version: v2
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: payment-gateway
      
      # Anti-affinity to spread across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: payment-gateway
                topologyKey: kubernetes.io/hostname
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role
                    operator: In
                    values:
                      - compute
      
      # Topology spread constraints
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: payment-gateway
      
      containers:
        - name: payment-gateway
          image: payment-switch/payment-gateway:v2.0.0
          imagePullPolicy: IfNotPresent
          
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          
          envFrom:
            - configMapRef:
                name: payment-gateway-config
          
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: password
          
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]

---
apiVersion: v1
kind: Service
metadata:
  name: payment-gateway
  namespace: payment-switch
  labels:
    app: payment-gateway
spec:
  type: ClusterIP
  selector:
    app: payment-gateway
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  sessionAffinity: None

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payment-gateway-hpa
  namespace: payment-switch
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payment-gateway
  minReplicas: 50
  maxReplicas: 200
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "1000"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 10
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
      selectPolicy: Min

---
# ============================================================================
# TIGERBEETLE STATEFULSET (Optimized for High Performance)
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: tigerbeetle
  namespace: payment-switch
  labels:
    app: tigerbeetle
spec:
  type: ClusterIP
  clusterIP: None  # Headless service
  selector:
    app: tigerbeetle
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: client

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tigerbeetle
  namespace: payment-switch
spec:
  serviceName: tigerbeetle
  # TigerBeetle recommends six replicas on dedicated machines for production.
  # Cluster membership is fixed at format time; do not scale this StatefulSet.
  replicas: 6
  podManagementPolicy: Parallel
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app: tigerbeetle
  template:
    metadata:
      labels:
        app: tigerbeetle
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: tigerbeetle
              topologyKey: kubernetes.io/hostname
      
      securityContext:
        seccompProfile:
          # TigerBeetle uses io_uring. Production admission controls must permit
          # this profile only for the dedicated ledger namespace.
          type: Unconfined
      containers:
        - name: tigerbeetle
          image: ghcr.io/tigerbeetle/tigerbeetle:0.17.9
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
          command: ["/bin/sh", "-ec"]
          args:
            - |
              ordinal="${HOSTNAME##*-}"
              data_file="/data/${TIGERBEETLE_CLUSTER_ID}_${ordinal}.tigerbeetle"
              addresses="tigerbeetle-0.tigerbeetle.payment-switch.svc.cluster.local:3000,tigerbeetle-1.tigerbeetle.payment-switch.svc.cluster.local:3000,tigerbeetle-2.tigerbeetle.payment-switch.svc.cluster.local:3000,tigerbeetle-3.tigerbeetle.payment-switch.svc.cluster.local:3000,tigerbeetle-4.tigerbeetle.payment-switch.svc.cluster.local:3000,tigerbeetle-5.tigerbeetle.payment-switch.svc.cluster.local:3000"
              case "$ordinal" in 0|1|2|3|4|5) ;; *) echo "invalid StatefulSet ordinal: $ordinal" >&2; exit 1;; esac
              test -n "${TIGERBEETLE_CLUSTER_ID:-}" || { echo "TIGERBEETLE_CLUSTER_ID is required" >&2; exit 1; }
              if [ ! -f "$data_file" ]; then
                /tigerbeetle format --cluster="$TIGERBEETLE_CLUSTER_ID" --replica-count=6 --replica="$ordinal" "$data_file"
              fi
              exec /tigerbeetle start --addresses="$addresses" "$data_file"
          env:
            - name: TIGERBEETLE_CLUSTER_ID
              valueFrom:
                secretKeyRef:
                  name: tigerbeetle-credentials
                  key: cluster-id
          
          ports:
            - containerPort: 3000
              name: client
              protocol: TCP
          
          resources:
            requests:
              cpu: 4000m
              memory: 8Gi
            limits:
              cpu: 8000m
              memory: 16Gi
          
          volumeMounts:
            - name: data
              mountPath: /data
          
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
  
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 1Ti

---
# ============================================================================
# POSTGRESQL STATEFULSET (Optimized with Read Replicas)
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: payment-switch
  labels:
    app: postgresql
spec:
  type: ClusterIP
  selector:
    app: postgresql
    role: primary
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgresql

---
apiVersion: v1
kind: Service
metadata:
  name: postgresql-read
  namespace: payment-switch
  labels:
    app: postgresql
spec:
  type: ClusterIP
  selector:
    app: postgresql
    role: replica
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgresql

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql-primary
  namespace: payment-switch
spec:
  serviceName: postgresql
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
      role: primary
  template:
    metadata:
      labels:
        app: postgresql
        role: primary
    spec:
      containers:
        - name: postgresql
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          
          env:
            - name: POSTGRES_DB
              value: payment_switch
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_INITDB_ARGS
              value: "--encoding=UTF8 --locale=en_US.UTF-8"
          
          ports:
            - containerPort: 5432
              name: postgresql
              protocol: TCP
          
          resources:
            requests:
              cpu: 4000m
              memory: 16Gi
            limits:
              cpu: 8000m
              memory: 32Gi
          
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: config
              mountPath: /etc/postgresql/postgresql.conf
              subPath: postgresql.conf
          
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U $POSTGRES_USER
            initialDelaySeconds: 30
            periodSeconds: 10
          
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U $POSTGRES_USER
            initialDelaySeconds: 10
            periodSeconds: 5
      
      volumes:
        - name: config
          configMap:
            name: postgresql-config
  
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 5Ti

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-config
  namespace: payment-switch
data:
  postgresql.conf: |
    # Performance tuning for 20B transactions/month
    max_connections = 1000
    shared_buffers = 8GB
    effective_cache_size = 24GB
    maintenance_work_mem = 2GB
    checkpoint_completion_target = 0.9
    wal_buffers = 16MB
    default_statistics_target = 100
    random_page_cost = 1.1
    effective_io_concurrency = 200
    work_mem = 20MB
    min_wal_size = 2GB
    max_wal_size = 8GB
    max_worker_processes = 8
    max_parallel_workers_per_gather = 4
    max_parallel_workers = 8
    max_parallel_maintenance_workers = 4

---
# ============================================================================
# KAFKA CLUSTER (Optimized for High Throughput)
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: payment-switch
  labels:
    app: kafka
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: kafka
  ports:
    - port: 9092
      targetPort: 9092
      protocol: TCP
      name: client
    - port: 9093
      targetPort: 9093
      protocol: TCP
      name: internal

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: payment-switch
spec:
  serviceName: kafka
  replicas: 10
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: kafka
              topologyKey: kubernetes.io/hostname
      
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.5.0
          imagePullPolicy: IfNotPresent
          
          env:
            - name: KAFKA_BROKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "zookeeper.payment-switch:2181"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://$(POD_NAME).kafka.payment-switch:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_NUM_NETWORK_THREADS
              value: "8"
            - name: KAFKA_NUM_IO_THREADS
              value: "16"
            - name: KAFKA_SOCKET_SEND_BUFFER_BYTES
              value: "102400"
            - name: KAFKA_SOCKET_RECEIVE_BUFFER_BYTES
              value: "102400"
            - name: KAFKA_SOCKET_REQUEST_MAX_BYTES
              value: "104857600"
            - name: KAFKA_NUM_PARTITIONS
              value: "100"
            - name: KAFKA_NUM_RECOVERY_THREADS_PER_DATA_DIR
              value: "4"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "168"
            - name: KAFKA_LOG_SEGMENT_BYTES
              value: "1073741824"
            - name: KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS
              value: "300000"
            - name: KAFKA_COMPRESSION_TYPE
              value: "lz4"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          
          ports:
            - containerPort: 9092
              name: client
              protocol: TCP
            - containerPort: 9093
              name: internal
              protocol: TCP
          
          resources:
            requests:
              cpu: 2000m
              memory: 8Gi
            limits:
              cpu: 4000m
              memory: 16Gi
          
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 2Ti

---
# ============================================================================
# REDIS CLUSTER (Optimized for Caching)
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: redis-master
  namespace: payment-switch
  labels:
    app: redis
    role: master
spec:
  type: ClusterIP
  selector:
    app: redis
    role: master
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-master
  namespace: payment-switch
spec:
  serviceName: redis-master
  replicas: 3
  selector:
    matchLabels:
      app: redis
      role: master
  template:
    metadata:
      labels:
        app: redis
        role: master
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          
          command:
            - redis-server
            - --cluster-enabled
            - "yes"
            - --cluster-config-file
            - /data/nodes.conf
            - --cluster-node-timeout
            - "5000"
            - --appendonly
            - "yes"
            - --maxmemory
            - 4gb
            - --maxmemory-policy
            - allkeys-lru
          
          ports:
            - containerPort: 6379
              name: redis
              protocol: TCP
            - containerPort: 16379
              name: cluster
              protocol: TCP
          
          resources:
            requests:
              cpu: 1000m
              memory: 4Gi
            limits:
              cpu: 2000m
              memory: 8Gi
          
          volumeMounts:
            - name: data
              mountPath: /data
  
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 100Gi

---
# ============================================================================
# TEMPORAL CLUSTER (Workflow Orchestration)
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: temporal-frontend
  namespace: payment-switch
  labels:
    app: temporal
    component: frontend
spec:
  type: ClusterIP
  selector:
    app: temporal
    component: frontend
  ports:
    - port: 7233
      targetPort: 7233
      protocol: TCP
      name: grpc

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-frontend
  namespace: payment-switch
spec:
  replicas: 5
  selector:
    matchLabels:
      app: temporal
      component: frontend
  template:
    metadata:
      labels:
        app: temporal
        component: frontend
    spec:
      containers:
        - name: temporal-frontend
          image: temporalio/server:1.22.0
          imagePullPolicy: IfNotPresent
          
          env:
            - name: SERVICES
              value: frontend
            - name: DB
              value: postgresql
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_SEEDS
              value: postgresql.payment-switch
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: username
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: password
          
          ports:
            - containerPort: 7233
              name: grpc
              protocol: TCP
          
          resources:
            requests:
              cpu: 2000m
              memory: 4Gi
            limits:
              cpu: 4000m
              memory: 8Gi

---
# ============================================================================
# NETWORK POLICIES
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payment-gateway-network-policy
  namespace: payment-switch
spec:
  podSelector:
    matchLabels:
      app: payment-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: istio-ingressgateway
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: temporal
      ports:
        - protocol: TCP
          port: 7233
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - protocol: TCP
          port: 9092
    - to:
        - podSelector:
            matchLabels:
              app: tigerbeetle
      ports:
        - protocol: TCP
          port: 3000
    - to:
        - podSelector:
            matchLabels:
              app: postgresql
      ports:
        - protocol: TCP
          port: 5432

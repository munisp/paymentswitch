# APISIX Routes with Keycloak JWT Validation
# This configuration enforces JWT authentication on all protected routes
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: mojaloop-transfers-route
  namespace: payment-switch
spec:
  http:
    - name: transfers-api
      match:
        hosts:
          - api.payment-switch.com
        paths:
          - /api/v1/transfers/*
      backends:
        - serviceName: mojaloop-service
          servicePort: 8080
      plugins:
        - name: authz-keycloak
          enable: true
          config:
            discovery: http://keycloak.payment-switch.svc.cluster.local:8080/realms/payment-switch/.well-known/openid-configuration
            client_id: payment-api
            client_secret_ref:
              name: keycloak-client-secret
              key: client-secret
            bearer_only: true
            realm: payment-switch
            ssl_verify: true
            cache_ttl_seconds: 300
        - name: request-id
          enable: true
        - name: prometheus
          enable: true
        - name: limit-req
          enable: true
          config:
            rate: 1000
            burst: 500
            key: consumer_name

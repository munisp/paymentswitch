---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflows-service
  namespace: payment-switch
  labels:
    app: workflows-service
    tier: orchestration
spec:
  replicas: 2
  selector:
    matchLabels:
      app: workflows-service
  template:
    metadata:
      labels:
        app: workflows-service
    spec:
      containers:
      - name: workflows-service
        image: payment-switch/workflows-service:latest
        ports:
        - containerPort: 8000
        env:
        - name: TEMPORAL_HOST
          value: temporal-frontend.payment-switch.svc.cluster.local:7233
        - name: TEMPORAL_NAMESPACE
          value: payment-switch
        - name: REDIS_HOST
          value: redis.payment-switch.svc.cluster.local
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: kafka.payment-switch.svc.cluster.local:9092
        - name: POSTGRES_HOST
          valueFrom:
            secretKeyRef:
              name: workflows-secrets
              key: POSTGRES_HOST
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: workflows-secrets
              key: POSTGRES_PASSWORD
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 500m
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: workflows-service
  namespace: payment-switch
  labels:
    app: workflows-service
spec:
  selector:
    app: workflows-service
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
  type: ClusterIP
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: workflows-secrets
  namespace: payment-switch
  labels:
    app: workflows-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: workflows-secrets
    creationPolicy: Owner
  data:
  - secretKey: POSTGRES_HOST
    remoteRef:
      key: payment-switch/workflows
      property: host
  - secretKey: POSTGRES_PASSWORD
    remoteRef:
      key: payment-switch/workflows
      property: password

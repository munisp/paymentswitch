apiVersion: apps/v1
kind: Deployment
metadata:
  name: biometric-auth-service
  namespace: payment-switch
  labels:
    app: biometric-auth-service
    tier: security
spec:
  replicas: 2
  selector:
    matchLabels:
      app: biometric-auth-service
  template:
    metadata:
      labels:
        app: biometric-auth-service
    spec:
      containers:
        - name: biometric-auth-service
          image: payment-switch/biometric-auth-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: biometric-auth-secrets
                  key: POSTGRES_HOST
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: biometric-auth-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_HOST
              value: "redis.payment-switch.svc.cluster.local"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.payment-switch.svc.cluster.local:9092"
            - name: BIOMETRIC_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: biometric-auth-secrets
                  key: BIOMETRIC_ENCRYPTION_KEY
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - biometric-auth-service
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: biometric-auth-service
  namespace: payment-switch
  labels:
    app: biometric-auth-service
spec:
  selector:
    app: biometric-auth-service
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: biometric-auth-secrets
  namespace: payment-switch
  labels:
    app: biometric-auth-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: biometric-auth-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_HOST
      remoteRef: { key: payment-switch/postgres, property: host }
    - secretKey: POSTGRES_PASSWORD
      remoteRef: { key: payment-switch/postgres, property: password }
    - secretKey: BIOMETRIC_ENCRYPTION_KEY
      remoteRef: { key: payment-switch/encryption, property: biometric_encryption_key }

apiVersion: apps/v1
kind: Deployment
metadata:
  name: advanced-analytics-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: advanced-analytics-service
  template:
    metadata:
      labels:
        app: advanced-analytics-service
    spec:
      containers:
      - name: advanced-analytics-service
        image: nextgen-payment-switch/advanced-analytics-service:latest
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        ports:
        - containerPort: 8000

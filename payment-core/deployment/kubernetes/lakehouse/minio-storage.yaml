---
# MinIO Object Storage for Lakehouse
# Provides S3-compatible storage for Delta Lake

apiVersion: v1
kind: Namespace
metadata:
  name: lakehouse
  labels:
    name: lakehouse

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: minio-config
  namespace: lakehouse
  labels:
    app: minio
data:
  MINIO_REGION: "us-east-1"
  MINIO_DOMAIN: "minio.lakehouse"
  MINIO_SERVER_URL: "http://minio.lakehouse:9000"
  MINIO_BROWSER: "on"

---
# Credentials are materialized only by External Secrets Operator. Applying this
# manifest without its referenced ClusterSecretStore intentionally leaves the
# workload pending rather than creating a deployable placeholder credential.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: minio-secrets
  namespace: lakehouse
  labels:
    app: minio
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: minio-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        MINIO_ROOT_USER: "{{ .root_user }}"
        MINIO_ROOT_PASSWORD: "{{ .root_password }}"
        MINIO_ACCESS_KEY: "{{ .access_key }}"
        MINIO_SECRET_KEY: "{{ .secret_key }}"
  data:
    - secretKey: root_user
      remoteRef:
        key: payment-switch/lakehouse/minio
        property: root_user
    - secretKey: root_password
      remoteRef:
        key: payment-switch/lakehouse/minio
        property: root_password
    - secretKey: access_key
      remoteRef:
        key: payment-switch/lakehouse/minio
        property: access_key
    - secretKey: secret_key
      remoteRef:
        key: payment-switch/lakehouse/minio
        property: secret_key

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: minio
  namespace: lakehouse
  labels:
    app: minio

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: lakehouse
  labels:
    app: minio
spec:
  serviceName: minio
  replicas: 4
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      serviceAccountName: minio
      
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: minio
              topologyKey: kubernetes.io/hostname
      
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-01-01T16-36-33Z
          imagePullPolicy: IfNotPresent
          
          args:
            - server
            - http://minio-{0...3}.minio.lakehouse/data
            - --console-address
            - ":9001"
          
          ports:
            - name: api
              containerPort: 9000
              protocol: TCP
            - name: console
              containerPort: 9001
              protocol: TCP
          
          envFrom:
            - configMapRef:
                name: minio-config
            - secretRef:
                name: minio-secrets
          
          resources:
            requests:
              cpu: 2000m
              memory: 4Gi
            limits:
              cpu: 4000m
              memory: 8Gi
          
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          
          volumeMounts:
            - name: data
              mountPath: /data
  
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 500Gi

---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: lakehouse
  labels:
    app: minio
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
      protocol: TCP
    - name: console
      port: 9001
      targetPort: 9001
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: minio-api
  namespace: lakehouse
  labels:
    app: minio
spec:
  type: LoadBalancer
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: minio-console
  namespace: lakehouse
  labels:
    app: minio
spec:
  type: LoadBalancer
  selector:
    app: minio
  ports:
    - name: console
      port: 9001
      targetPort: 9001
      protocol: TCP

---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-setup
  namespace: lakehouse
  labels:
    app: minio-setup
spec:
  template:
    metadata:
      labels:
        app: minio-setup
    spec:
      restartPolicy: OnFailure
      
      initContainers:
        - name: wait-for-minio
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z minio.lakehouse 9000; do
                echo "Waiting for MinIO..."
                sleep 2
              done
              echo "MinIO is ready"
      
      containers:
        - name: mc
          image: minio/mc:RELEASE.2024-01-01T16-01-16Z
          envFrom:
            - secretRef:
                name: minio-secrets
          command:
            - sh
            - -c
            - |
              # Configure mc
              mc alias set minio http://minio.lakehouse:9000 $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD
              
              # Create buckets
              mc mb --ignore-existing minio/delta-lake
              mc mb --ignore-existing minio/raw-data
              mc mb --ignore-existing minio/processed-data
              mc mb --ignore-existing minio/ml-models
              mc mb --ignore-existing minio/checkpoints
              
              # Set bucket policies (public read for processed-data)
              mc anonymous set download minio/processed-data
              
              # Enable versioning for delta-lake bucket
              mc version enable minio/delta-lake
              
              # Set lifecycle policies
              mc ilm add --expiry-days 90 minio/raw-data
              
              echo "MinIO setup completed successfully"

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: minio-pdb
  namespace: lakehouse
  labels:
    app: minio
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: minio

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minio-network-policy
  namespace: lakehouse
  labels:
    app: minio
spec:
  podSelector:
    matchLabels:
      app: minio
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from Flink
    - from:
        - podSelector:
            matchLabels:
              app: flink
      ports:
        - protocol: TCP
          port: 9000
    # Allow traffic from Spark
    - from:
        - podSelector:
            matchLabels:
              app: spark
      ports:
        - protocol: TCP
          port: 9000
    # Allow traffic from Ray
    - from:
        - podSelector:
            matchLabels:
              app: ray
      ports:
        - protocol: TCP
          port: 9000
    # Allow external access
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9001
  egress:
    # Allow all egress (MinIO needs to communicate with other nodes)
    - to:
        - podSelector:
            matchLabels:
              app: minio
      ports:
        - protocol: TCP
          port: 9000
    # Allow DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53

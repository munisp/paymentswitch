---
# RustFS Object Storage for Lakehouse
# High-performance S3-compatible storage built in Rust
# Replaces MinIO with 2.3x faster performance for small objects
# Apache 2.0 license (vs MinIO's AGPL)

apiVersion: v1
kind: Namespace
metadata:
  name: lakehouse
  labels:
    name: lakehouse

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rustfs-config
  namespace: lakehouse
  labels:
    app: rustfs
data:
  RUSTFS_REGION: "us-east-1"
  RUSTFS_DOMAIN: "rustfs.lakehouse"
  RUSTFS_SERVER_URL: "http://rustfs.lakehouse:9000"
  RUSTFS_CONSOLE_ENABLED: "true"
  # S3 compatibility settings
  RUSTFS_S3_PATH_STYLE: "true"
  RUSTFS_S3_SIGNATURE_VERSION: "4"

---
# Credentials are materialized only by External Secrets Operator. Applying this
# manifest without its referenced ClusterSecretStore intentionally leaves the
# workload pending rather than creating a deployable placeholder credential.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rustfs-secrets
  namespace: lakehouse
  labels:
    app: rustfs
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: rustfs-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        RUSTFS_ROOT_USER: "{{ .root_user }}"
        RUSTFS_ROOT_PASSWORD: "{{ .root_password }}"
        AWS_ACCESS_KEY_ID: "{{ .access_key }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secret_key }}"
  data:
    - secretKey: root_user
      remoteRef:
        key: payment-switch/lakehouse/rustfs
        property: root_user
    - secretKey: root_password
      remoteRef:
        key: payment-switch/lakehouse/rustfs
        property: root_password
    - secretKey: access_key
      remoteRef:
        key: payment-switch/lakehouse/rustfs
        property: access_key
    - secretKey: secret_key
      remoteRef:
        key: payment-switch/lakehouse/rustfs
        property: secret_key

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rustfs
  namespace: lakehouse
  labels:
    app: rustfs

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rustfs
  namespace: lakehouse
  labels:
    app: rustfs
    storage-backend: rustfs
spec:
  serviceName: rustfs
  replicas: 4
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
        storage-backend: rustfs
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: rustfs
      
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: rustfs
              topologyKey: kubernetes.io/hostname
      
      containers:
        - name: rustfs
          image: rustfs/rustfs:latest
          imagePullPolicy: Always
          
          args:
            - server
            - http://rustfs-{0...3}.rustfs.lakehouse:9000/data
            - --console-address
            - ":9001"
          
          ports:
            - name: api
              containerPort: 9000
              protocol: TCP
            - name: console
              containerPort: 9001
              protocol: TCP
          
          env:
            - name: RUSTFS_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: rustfs-secrets
                  key: RUSTFS_ROOT_USER
            - name: RUSTFS_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rustfs-secrets
                  key: RUSTFS_ROOT_PASSWORD
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: rustfs-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-secrets
                  key: AWS_SECRET_ACCESS_KEY
          
          envFrom:
            - configMapRef:
                name: rustfs-config
          
          resources:
            requests:
              cpu: 2000m
              memory: 4Gi
            limits:
              cpu: 4000m
              memory: 8Gi
          
          # RustFS health check endpoints
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          
          volumeMounts:
            - name: data
              mountPath: /data
  
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 500Gi

---
# Headless service for StatefulSet DNS
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: lakehouse
  labels:
    app: rustfs
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: rustfs
  ports:
    - name: api
      port: 9000
      targetPort: 9000
      protocol: TCP
    - name: console
      port: 9001
      targetPort: 9001
      protocol: TCP

---
# LoadBalancer service for API access
apiVersion: v1
kind: Service
metadata:
  name: rustfs-api
  namespace: lakehouse
  labels:
    app: rustfs
spec:
  type: LoadBalancer
  selector:
    app: rustfs
  ports:
    - name: api
      port: 9000
      targetPort: 9000
      protocol: TCP

---
# LoadBalancer service for Console access
apiVersion: v1
kind: Service
metadata:
  name: rustfs-console
  namespace: lakehouse
  labels:
    app: rustfs
spec:
  type: LoadBalancer
  selector:
    app: rustfs
  ports:
    - name: console
      port: 9001
      targetPort: 9001
      protocol: TCP

---
# Bucket setup job using AWS CLI (S3-compatible)
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-setup
  namespace: lakehouse
  labels:
    app: rustfs-setup
spec:
  template:
    metadata:
      labels:
        app: rustfs-setup
    spec:
      restartPolicy: OnFailure
      
      initContainers:
        - name: wait-for-rustfs
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z rustfs.lakehouse 9000; do
                echo "Waiting for RustFS..."
                sleep 2
              done
              echo "RustFS is ready"
      
      containers:
        - name: aws-cli
          image: amazon/aws-cli:2.15.0
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: rustfs-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
          command:
            - sh
            - -c
            - |
              # Set endpoint for RustFS
              ENDPOINT="http://rustfs.lakehouse:9000"
              
              # Create buckets using S3 API
              echo "Creating buckets..."
              aws --endpoint-url $ENDPOINT s3 mb s3://delta-lake --region us-east-1 || true
              aws --endpoint-url $ENDPOINT s3 mb s3://raw-data --region us-east-1 || true
              aws --endpoint-url $ENDPOINT s3 mb s3://processed-data --region us-east-1 || true
              aws --endpoint-url $ENDPOINT s3 mb s3://ml-models --region us-east-1 || true
              aws --endpoint-url $ENDPOINT s3 mb s3://checkpoints --region us-east-1 || true
              aws --endpoint-url $ENDPOINT s3 mb s3://onboarding-documents --region us-east-1 || true
              aws --endpoint-url $ENDPOINT s3 mb s3://lakehouse --region us-east-1 || true
              
              # Enable versioning for delta-lake bucket
              echo "Enabling versioning on delta-lake bucket..."
              aws --endpoint-url $ENDPOINT s3api put-bucket-versioning \
                --bucket delta-lake \
                --versioning-configuration Status=Enabled || true
              
              # Set lifecycle policy for raw-data (90 day expiry)
              echo "Setting lifecycle policy on raw-data bucket..."
              cat > /tmp/lifecycle.json << 'EOF'
              {
                "Rules": [
                  {
                    "ID": "ExpireAfter90Days",
                    "Status": "Enabled",
                    "Filter": {},
                    "Expiration": {
                      "Days": 90
                    }
                  }
                ]
              }
              EOF
              aws --endpoint-url $ENDPOINT s3api put-bucket-lifecycle-configuration \
                --bucket raw-data \
                --lifecycle-configuration file:///tmp/lifecycle.json || true
              
              # Set public read policy for processed-data
              echo "Setting public read policy on processed-data bucket..."
              cat > /tmp/policy.json << 'EOF'
              {
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Sid": "PublicRead",
                    "Effect": "Allow",
                    "Principal": "*",
                    "Action": ["s3:GetObject"],
                    "Resource": ["arn:aws:s3:::processed-data/*"]
                  }
                ]
              }
              EOF
              aws --endpoint-url $ENDPOINT s3api put-bucket-policy \
                --bucket processed-data \
                --policy file:///tmp/policy.json || true
              
              echo "RustFS setup completed successfully"

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rustfs-pdb
  namespace: lakehouse
  labels:
    app: rustfs
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: rustfs

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rustfs-network-policy
  namespace: lakehouse
  labels:
    app: rustfs
spec:
  podSelector:
    matchLabels:
      app: rustfs
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from Flink
    - from:
        - podSelector:
            matchLabels:
              app: flink
      ports:
        - protocol: TCP
          port: 9000
    # Allow traffic from Spark
    - from:
        - podSelector:
            matchLabels:
              app: spark
      ports:
        - protocol: TCP
          port: 9000
    # Allow traffic from Ray
    - from:
        - podSelector:
            matchLabels:
              app: ray
      ports:
        - protocol: TCP
          port: 9000
    # Allow traffic from payment-switch namespace
    - from:
        - namespaceSelector:
            matchLabels:
              name: payment-switch
      ports:
        - protocol: TCP
          port: 9000
    # Allow external access
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9001
  egress:
    # Allow RustFS nodes to communicate with each other
    - to:
        - podSelector:
            matchLabels:
              app: rustfs
      ports:
        - protocol: TCP
          port: 9000
    # Allow DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53

---
# HorizontalPodAutoscaler for RustFS (optional, for dynamic scaling)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rustfs-hpa
  namespace: lakehouse
  labels:
    app: rustfs
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: rustfs
  minReplicas: 4
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# ServiceMonitor for Prometheus (if using Prometheus Operator)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rustfs-monitor
  namespace: lakehouse
  labels:
    app: rustfs
spec:
  selector:
    matchLabels:
      app: rustfs
  endpoints:
    - port: api
      path: /minio/v2/metrics/cluster
      interval: 30s
  namespaceSelector:
    matchNames:
      - lakehouse

apiVersion: v1
kind: ConfigMap
metadata:
  name: temporal-config
  namespace: payment-switch
data:
  config.yaml: |
    log:
      stdout: true
      level: info
    persistence:
      defaultStore: default
      visibilityStore: visibility
      numHistoryShards: 512
      datastores:
        default:
          sql:
            pluginName: "postgres"
            databaseName: "temporal"
            connectAddr: "postgresql:5432"
            connectProtocol: "tcp"
            user: "temporal"
            password: "{{ .Env.TEMPORAL_POSTGRES_PASSWORD }}"
            maxConns: 20
            maxIdleConns: 20
            maxConnLifetime: "1h"
        visibility:
          sql:
            pluginName: "postgres"
            databaseName: "temporal_visibility"
            connectAddr: "postgresql:5432"
            connectProtocol: "tcp"
            user: "temporal"
            password: "{{ .Env.TEMPORAL_POSTGRES_PASSWORD }}"
            maxConns: 10
            maxIdleConns: 10
            maxConnLifetime: "1h"
    global:
      membership:
        maxJoinDuration: 30s
      pprof:
        port: 7936
    services:
      frontend:
        rpc:
          grpcPort: 7233
          membershipPort: 6933
          bindOnLocalHost: false
      matching:
        rpc:
          grpcPort: 7235
          membershipPort: 6935
          bindOnLocalHost: false
      history:
        rpc:
          grpcPort: 7234
          membershipPort: 6934
          bindOnLocalHost: false
      worker:
        rpc:
          grpcPort: 7239
          membershipPort: 6939
          bindOnLocalHost: false
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: temporal-server-secrets
  namespace: payment-switch
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: temporal-server-secrets
    creationPolicy: Owner
  data:
    - secretKey: TEMPORAL_POSTGRES_PASSWORD
      remoteRef: { key: payment-switch/temporal, property: postgres_password }

---
apiVersion: v1
kind: Service
metadata:
  name: temporal-frontend
  namespace: payment-switch
spec:
  ports:
  - port: 7233
    name: grpc
    protocol: TCP
  selector:
    app: temporal
    service: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-frontend
  namespace: payment-switch
spec:
  replicas: 3
  selector:
    matchLabels:
      app: temporal
      service: frontend
  template:
    metadata:
      labels:
        app: temporal
        service: frontend
    spec:
      containers:
      - name: temporal-frontend
        image: temporalio/server:1.22.0
        args: ["start", "--service=frontend"]
        ports:
        - containerPort: 7233
          name: grpc
        - containerPort: 6933
          name: membership
        envFrom:
        - secretRef:
            name: temporal-server-secrets
        env:
        - name: TEMPORAL_CONFIG
          value: "/etc/temporal/config.yaml"
        volumeMounts:
        - name: config
          mountPath: /etc/temporal
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
      volumes:
      - name: config
        configMap:
          name: temporal-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-history
  namespace: payment-switch
spec:
  replicas: 3
  selector:
    matchLabels:
      app: temporal
      service: history
  template:
    metadata:
      labels:
        app: temporal
        service: history
    spec:
      containers:
      - name: temporal-history
        image: temporalio/server:1.22.0
        args: ["start", "--service=history"]
        ports:
        - containerPort: 7234
          name: grpc
        - containerPort: 6934
          name: membership
        envFrom:
        - secretRef:
            name: temporal-server-secrets
        env:
        - name: TEMPORAL_CONFIG
          value: "/etc/temporal/config.yaml"
        volumeMounts:
        - name: config
          mountPath: /etc/temporal
        resources:
          requests:
            memory: "4Gi"
            cpu: "2000m"
          limits:
            memory: "8Gi"
            cpu: "4000m"
      volumes:
      - name: config
        configMap:
          name: temporal-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-matching
  namespace: payment-switch
spec:
  replicas: 3
  selector:
    matchLabels:
      app: temporal
      service: matching
  template:
    metadata:
      labels:
        app: temporal
        service: matching
    spec:
      containers:
      - name: temporal-matching
        image: temporalio/server:1.22.0
        args: ["start", "--service=matching"]
        ports:
        - containerPort: 7235
          name: grpc
        - containerPort: 6935
          name: membership
        envFrom:
        - secretRef:
            name: temporal-server-secrets
        env:
        - name: TEMPORAL_CONFIG
          value: "/etc/temporal/config.yaml"
        volumeMounts:
        - name: config
          mountPath: /etc/temporal
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
      volumes:
      - name: config
        configMap:
          name: temporal-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-worker
  namespace: payment-switch
spec:
  replicas: 2
  selector:
    matchLabels:
      app: temporal
      service: worker
  template:
    metadata:
      labels:
        app: temporal
        service: worker
    spec:
      containers:
      - name: temporal-worker
        image: temporalio/server:1.22.0
        args: ["start", "--service=worker"]
        ports:

# Required managed-secret targets for workloads that historically relied on
# implicit pre-provisioning. Vault paths are explicit and dataFrom preserves the
# target key names expected by each workload. Missing Vault material leaves pods
# pending rather than creating local defaults.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: apisix-secrets, namespace: apisix }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  target: { name: apisix-secrets, creationPolicy: Owner }
  dataFrom:
    - extract: { key: payment-switch/apisix/secrets }

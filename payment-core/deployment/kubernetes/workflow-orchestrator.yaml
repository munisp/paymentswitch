---
# Python Workflow Orchestrator - Kubernetes Deployment Manifest
# Temporal-based workflow orchestration service with gRPC integration

apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-orchestrator-config
  namespace: payment-switch
  labels:
    app: workflow-orchestrator
    tier: backend
    language: python
data:
  # Application settings
  APP_NAME: "workflow-orchestrator"
  APP_VERSION: "v1.0.0"
  ENVIRONMENT: "production"
  LOG_LEVEL: "info"
  WORKERS: "4"
  
  # Temporal settings
  TEMPORAL_HOST: "temporal-frontend.payment-switch"
  TEMPORAL_PORT: "7233"
  TEMPORAL_NAMESPACE: "payment-switch"
  TEMPORAL_TASK_QUEUE: "payment-processing"
  TEMPORAL_MAX_CONCURRENT_ACTIVITIES: "100"
  TEMPORAL_MAX_CONCURRENT_WORKFLOWS: "50"
  
  # gRPC service endpoints
  LEDGER_SERVICE_HOST: "ledger-service.payment-switch"
  LEDGER_SERVICE_PORT: "50051"
  PARTY_SERVICE_HOST: "party-service.payment-switch"
  PARTY_SERVICE_PORT: "50052"
  ACCOUNT_SERVICE_HOST: "account-service.payment-switch"
  ACCOUNT_SERVICE_PORT: "50053"
  
  # Database settings
  POSTGRES_HOST: "postgresql.payment-switch"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "payment_switch"
  POSTGRES_MIN_POOL_SIZE: "10"
  POSTGRES_MAX_POOL_SIZE: "50"
  
  # Redis settings
  REDIS_HOST: "redis-master.payment-switch"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_MAX_CONNECTIONS: "50"
  
  # Kafka settings
  KAFKA_BOOTSTRAP_SERVERS: "kafka.payment-switch:9092"
  KAFKA_CONSUMER_GROUP: "workflow-orchestrator-group"
  KAFKA_AUTO_OFFSET_RESET: "earliest"
  
  # Performance settings
  GRPC_MAX_WORKERS: "100"
  GRPC_KEEPALIVE_TIME_MS: "30000"
  GRPC_KEEPALIVE_TIMEOUT_MS: "10000"
  HTTP_TIMEOUT: "30"
  MAX_RETRIES: "3"

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: workflow-orchestrator-secrets
  namespace: payment-switch
  labels:
    app: workflow-orchestrator
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: workflow-orchestrator-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef: { key: payment-switch/postgres, property: username }
    - secretKey: POSTGRES_PASSWORD
      remoteRef: { key: payment-switch/postgres, property: password }
    - secretKey: REDIS_PASSWORD
      remoteRef: { key: payment-switch/redis, property: password }
    - secretKey: JWT_SECRET
      remoteRef: { key: payment-switch/encryption, property: jwt_secret }

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workflow-orchestrator
  namespace: payment-switch
  labels:
    app: workflow-orchestrator

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-orchestrator
  namespace: payment-switch
  labels:
    app: workflow-orchestrator
    tier: backend
    language: python
    version: v1.0.0
spec:
  replicas: 20
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 5
      maxUnavailable: 2
  selector:
    matchLabels:
      app: workflow-orchestrator
  template:
    metadata:
      labels:
        app: workflow-orchestrator
        tier: backend
        language: python
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
        dapr.io/enabled: "true"
        dapr.io/app-id: "workflow-orchestrator"
        dapr.io/app-port: "8080"
        dapr.io/app-protocol: "http"
        dapr.io/enable-profiling: "true"
        dapr.io/log-level: "info"
        dapr.io/sidecar-cpu-limit: "1000m"
        dapr.io/sidecar-memory-limit: "512Mi"
        dapr.io/sidecar-cpu-request: "500m"
        dapr.io/sidecar-memory-request: "256Mi"
    spec:
      serviceAccountName: workflow-orchestrator
      
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      # Anti-affinity to spread pods across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: workflow-orchestrator
                topologyKey: kubernetes.io/hostname
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: workflow-orchestrator
                topologyKey: topology.kubernetes.io/zone
        
        # Prefer nodes with compute characteristics
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - compute
                      - general-purpose
      
      # Topology spread constraints
      topologySpreadConstraints:
        - maxSkew: 3
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: workflow-orchestrator
        - maxSkew: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: workflow-orchestrator
      
      # Init containers
      initContainers:
        - name: wait-for-temporal
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z temporal-frontend.payment-switch 7233; do
                echo "Waiting for Temporal..."
                sleep 2
              done
              echo "Temporal is ready"
        
        - name: wait-for-ledger-service
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z ledger-service.payment-switch 50051; do
                echo "Waiting for Ledger Service..."
                sleep 2
              done
              echo "Ledger Service is ready"
        
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgresql.payment-switch 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready"
      
      containers:
        - name: workflow-orchestrator
          image: payment-switch/workflow-orchestrator:v1.0.0
          imagePullPolicy: IfNotPresent
          
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          
          envFrom:
            - configMapRef:
                name: workflow-orchestrator-config
            - secretRef:
                name: workflow-orchestrator-secrets
          
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
              ephemeral-storage: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
              ephemeral-storage: 2Gi
          
          # Liveness probe
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          
          # Readiness probe
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
            successThreshold: 1
          
          # Startup probe
          startupProbe:
            httpGet:
              path: /health/startup
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
            successThreshold: 1
          
          # Lifecycle hooks
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - sleep 15
          
          # Security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          
          # Volume mounts
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /cache
            - name: logs
              mountPath: /var/log/app
      
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: logs
          emptyDir: {}
      
      # DNS configuration
      dnsPolicy: ClusterFirst
      dnsConfig:
        options:
          - name: ndots
            value: "2"
          - name: edns0
      
      # Termination grace period
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: workflow-orchestrator
  namespace: payment-switch
  labels:
    app: workflow-orchestrator
    tier: backend
spec:
  type: ClusterIP
  sessionAffinity: None
  selector:
    app: workflow-orchestrator
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: workflow-orchestrator-headless
  namespace: payment-switch
  labels:
    app: workflow-orchestrator
    tier: backend
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: workflow-orchestrator
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: workflow-orchestrator-hpa
  namespace: payment-switch
  labels:
    app: workflow-orchestrator
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: workflow-orchestrator
  minReplicas: 20
  maxReplicas: 100
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    - type: Pods
      pods:
        metric:
          name: workflow_executions_per_second
        target:
          type: AverageValue
          averageValue: "50"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 10
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
        - type: Pods
          value: 3
          periodSeconds: 60
      selectPolicy: Min

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: workflow-orchestrator-pdb
  namespace: payment-switch
  labels:
    app: workflow-orchestrator
spec:
  minAvailable: 10
  selector:
    matchLabels:
      app: workflow-orchestrator

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workflow-orchestrator-network-policy
  namespace: payment-switch
  labels:
    app: workflow-orchestrator
spec:
  podSelector:
    matchLabels:
      app: workflow-orchestrator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from payment gateway
    - from:
        - podSelector:
            matchLabels:
              app: payment-gateway
      ports:
        - protocol: TCP
          port: 8080
    # Allow traffic from other workflow orchestrator pods
    - from:
        - podSelector:
            matchLabels:
              app: workflow-orchestrator
      ports:
        - protocol: TCP
          port: 8080
    # Allow metrics scraping from Prometheus
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 9090
  egress:
    # Allow traffic to Temporal
    - to:
        - podSelector:
            matchLabels:
              app: temporal
      ports:
        - protocol: TCP
          port: 7233
    # Allow traffic to Ledger Service (gRPC)
    - to:
        - podSelector:
            matchLabels:
              app: ledger-service
      ports:
        - protocol: TCP
          port: 50051
    # Allow traffic to Party Service (gRPC)
    - to:
        - podSelector:
            matchLabels:
              app: party-service
      ports:
        - protocol: TCP
          port: 50052
    # Allow traffic to Account Service (gRPC)
    - to:
        - podSelector:
            matchLabels:
              app: account-service
      ports:
        - protocol: TCP
          port: 50053
    # Allow traffic to PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app: postgresql
      ports:
        - protocol: TCP
          port: 5432
    # Allow traffic to Redis
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    # Allow traffic to Kafka
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - protocol: TCP
          port: 9092
    # Allow traffic to Fraud Detection
    - to:
        - podSelector:
            matchLabels:
              app: fraud-detection
      ports:
        - protocol: TCP
          port: 8081
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # Allow traffic to Dapr control plane
    - to:
        - namespaceSelector:
            matchLabels:
              name: dapr-system
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443

---
apiVersion: v1
kind: ServiceMonitor
metadata:
  name: workflow-orchestrator-monitor
  namespace: payment-switch
  labels:
    app: workflow-orchestrator
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      app: workflow-orchestrator
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics

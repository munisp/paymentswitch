---
# Prometheus Exporters for Security Monitoring
# Exposes Wazuh and OpenCTI metrics to Prometheus

apiVersion: v1
kind: ConfigMap
metadata:
  name: wazuh-exporter-config
  namespace: security
  labels:
    app: wazuh-exporter
data:
  config.yaml: |
    wazuh:
      api_url: http://wazuh-manager.security.svc.cluster.local:55000
      api_user: wazuh
      api_password: wazuh
      verify_ssl: false
    
    prometheus:
      port: 9090
      path: /metrics
    
    metrics:
      - name: wazuh_alerts_total
        help: Total number of Wazuh alerts
        type: counter
        query: /alerts
      
      - name: wazuh_agents_total
        help: Total number of Wazuh agents
        type: gauge
        query: /agents
      
      - name: wazuh_agents_active
        help: Number of active Wazuh agents
        type: gauge
        query: /agents?status=active
      
      - name: wazuh_agents_disconnected
        help: Number of disconnected Wazuh agents
        type: gauge
        query: /agents?status=disconnected
      
      - name: wazuh_vulnerabilities_total
        help: Total number of vulnerabilities detected
        type: gauge
        query: /vulnerability
      
      - name: wazuh_sca_checks_failed
        help: Number of failed SCA checks
        type: gauge
        query: /sca

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: security-exporter-secrets
  namespace: security
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: security-exporter-secrets
    creationPolicy: Owner
  data:
    - secretKey: WAZUH_API_PASSWORD
      remoteRef: { key: payment-switch/security/wazuh, property: api_password }
    - secretKey: OPENCTI_API_TOKEN
      remoteRef: { key: payment-switch/security/opencti, property: api_token }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wazuh-exporter
  namespace: security
  labels:
    app: wazuh-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wazuh-exporter
  template:
    metadata:
      labels:
        app: wazuh-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: wazuh-exporter
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          
          command:
            - /bin/sh
            - -c
            - |
              pip install prometheus-client requests
              cat > /app/exporter.py << 'EOF'
              #!/usr/bin/env python3
              import time
              import requests
              from prometheus_client import start_http_server, Counter, Gauge
              import logging
              import os
              
              logging.basicConfig(level=logging.INFO)
              logger = logging.getLogger(__name__)
              
              # Managed secret and CA paths are required; no credential/TLS fallback is permitted.
              WAZUH_API_URL = os.environ['WAZUH_API_URL']
              WAZUH_API_USER = os.environ['WAZUH_API_USER']
              WAZUH_API_PASSWORD = os.environ['WAZUH_API_PASSWORD']
              WAZUH_CA_FILE = os.environ['WAZUH_CA_FILE']
              
              # Prometheus metrics
              alerts_total = Counter('wazuh_alerts_total', 'Total number of Wazuh alerts')
              agents_total = Gauge('wazuh_agents_total', 'Total number of Wazuh agents')
              agents_active = Gauge('wazuh_agents_active', 'Number of active Wazuh agents')
              agents_disconnected = Gauge('wazuh_agents_disconnected', 'Number of disconnected Wazuh agents')
              vulnerabilities_total = Gauge('wazuh_vulnerabilities_total', 'Total number of vulnerabilities')
              
              def get_wazuh_token():
                  """Get authentication token from Wazuh API"""
                  try:
                      response = requests.post(
                          f"{WAZUH_API_URL}/security/user/authenticate",
                          auth=(WAZUH_API_USER, WAZUH_API_PASSWORD),
                          verify=WAZUH_CA_FILE
                      )
                      return response.json()['data']['token']
                  except Exception as e:
                      logger.error(f"Failed to get Wazuh token: {e}")
                      return None
              
              def collect_metrics():
                  """Collect metrics from Wazuh API"""
                  token = get_wazuh_token()
                  if not token:
                      return
                  
                  headers = {'Authorization': f'Bearer {token}'}
                  
                  try:
                      # Get agents statistics
                      response = requests.get(
                          f"{WAZUH_API_URL}/agents/summary/status",
                          headers=headers,
                          verify=WAZUH_CA_FILE
                      )
                      data = response.json()['data']
                      agents_total.set(data.get('total', 0))
                      agents_active.set(data.get('active', 0))
                      agents_disconnected.set(data.get('disconnected', 0))
                      
                      # Get alerts count
                      response = requests.get(
                          f"{WAZUH_API_URL}/alerts",
                          headers=headers,
                          verify=WAZUH_CA_FILE
                      )
                      alerts_count = response.json()['data']['total_affected_items']
                      alerts_total.inc(alerts_count)
                      
                      logger.info(f"Collected metrics: agents_total={data.get('total', 0)}, alerts={alerts_count}")
                      
                  except Exception as e:
                      logger.error(f"Failed to collect metrics: {e}")
              
              if __name__ == '__main__':
                  start_http_server(9090)
                  logger.info("Wazuh exporter started on port 9090")
                  
                  while True:
                      collect_metrics()
                      time.sleep(30)
              EOF
              python /app/exporter.py
          
          envFrom:
            - secretRef:
                name: security-exporter-secrets
          env:
            - name: WAZUH_API_URL
              value: "https://wazuh-manager.security.svc.cluster.local:55000"
            - name: WAZUH_API_USER
              value: "wazuh"
            - name: WAZUH_CA_FILE
              value: "/var/run/secrets/wazuh/ca.crt"
          ports:
            - name: metrics
              containerPort: 9090
          
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-exporter
  namespace: security
  labels:
    app: wazuh-exporter
spec:
  type: ClusterIP
  selector:
    app: wazuh-exporter
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencti-exporter-config
  namespace: security
  labels:
    app: opencti-exporter
data:
  config.yaml: |
    opencti:
      api_url: https://opencti-platform.security.svc.cluster.local:8443
      # API token is injected through security-exporter-secrets.
    
    prometheus:
      port: 9091
      path: /metrics

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencti-exporter
  namespace: security
  labels:
    app: opencti-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opencti-exporter
  template:
    metadata:
      labels:
        app: opencti-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: opencti-exporter
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          
          envFrom:
            - secretRef:
                name: security-exporter-secrets
          env:
            - name: OPENCTI_API_URL
              value: "https://opencti-platform.security.svc.cluster.local:8443"
          command:
            - /bin/sh
            - -c
            - |
              pip install prometheus-client requests pycti
              cat > /app/exporter.py << 'EOF'
              #!/usr/bin/env python3
              import time
              import requests
              from prometheus_client import start_http_server, Gauge
              import logging
              import os
              
              logging.basicConfig(level=logging.INFO)
              logger = logging.getLogger(__name__)
              
              # Managed OpenCTI credential is required; missing credentials fail at startup.
              OPENCTI_API_URL = os.environ['OPENCTI_API_URL']
              OPENCTI_API_TOKEN = os.environ['OPENCTI_API_TOKEN']
              
              # Prometheus metrics
              indicators_total = Gauge('opencti_indicators_total', 'Total number of indicators')
              observables_total = Gauge('opencti_observables_total', 'Total number of observables')
              reports_total = Gauge('opencti_reports_total', 'Total number of reports')
              threats_total = Gauge('opencti_threats_total', 'Total number of threat actors')
              
              def collect_metrics():
                  """Collect metrics from OpenCTI API"""
                  headers = {'Authorization': f'Bearer {OPENCTI_API_TOKEN}'}
                  
                  try:
                      # GraphQL query for statistics
                      query = """
                      query {
                        indicators {
                          pageInfo {
                            globalCount
                          }
                        }
                        stixCyberObservables {
                          pageInfo {
                            globalCount
                          }
                        }
                        reports {
                          pageInfo {
                            globalCount
                          }
                        }
                        threatActors {
                          pageInfo {
                            globalCount
                          }
                        }
                      }
                      """
                      
                      response = requests.post(
                          f"{OPENCTI_API_URL}/graphql",
                          json={'query': query},
                          headers=headers
                      )
                      
                      data = response.json()['data']
                      indicators_total.set(data['indicators']['pageInfo']['globalCount'])
                      observables_total.set(data['stixCyberObservables']['pageInfo']['globalCount'])
                      reports_total.set(data['reports']['pageInfo']['globalCount'])
                      threats_total.set(data['threatActors']['pageInfo']['globalCount'])
                      
                      logger.info(f"Collected metrics: indicators={data['indicators']['pageInfo']['globalCount']}")
                      
                  except Exception as e:
                      logger.error(f"Failed to collect metrics: {e}")
              
              if __name__ == '__main__':
                  start_http_server(9091)
                  logger.info("OpenCTI exporter started on port 9091")
                  
                  while True:
                      collect_metrics()
                      time.sleep(60)
              EOF
              python /app/exporter.py
          
          ports:
            - name: metrics
              containerPort: 9091
          
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: opencti-exporter
  namespace: security
  labels:
    app: opencti-exporter
spec:
  type: ClusterIP
  selector:
    app: opencti-exporter
  ports:
    - name: metrics
      port: 9091
      targetPort: 9091

---
# Update Prometheus ConfigMap to scrape security exporters
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-security-scrape-config
  namespace: monitoring
  labels:
    app: prometheus
data:
  security-scrape.yml: |
    # Security monitoring scrape configurations
    - job_name: 'wazuh-exporter'
      static_configs:
        - targets: ['wazuh-exporter.security.svc.cluster.local:9090']
          labels:
            component: wazuh
            security: siem
    
    - job_name: 'opencti-exporter'
      static_configs:
        - targets: ['opencti-exporter.security.svc.cluster.local:9091']
          labels:
            component: opencti
            security: threat-intelligence

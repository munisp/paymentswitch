---
# Go Ledger Service - Kubernetes Deployment Manifest
# High-performance gRPC service for TigerBeetle ledger operations

apiVersion: v1
kind: ConfigMap
metadata:
  name: ledger-service-config
  namespace: payment-switch
  labels:
    app: ledger-service
    tier: backend
    language: go
data:
  LEDGER_SERVICE_PORT: "50051"
  TIGERBEETLE_HOST: "tigerbeetle.payment-switch.svc.cluster.local"
  TIGERBEETLE_PORT: "3000"
  POSTGRES_HOST: "postgresql.payment-switch"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "payment_switch"
  LOG_LEVEL: "info"
  GRPC_MAX_CONNECTIONS: "1000"
  TIGERBEETLE_POOL_SIZE: "20"
  POSTGRES_MIN_CONNS: "20"
  POSTGRES_MAX_CONNS: "100"

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ledger-service-secrets
  namespace: payment-switch
  labels:
    app: ledger-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ledger-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef: { key: payment-switch/postgres, property: username }
    - secretKey: POSTGRES_PASSWORD
      remoteRef: { key: payment-switch/postgres, property: password }

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ledger-service
  namespace: payment-switch
  labels:
    app: ledger-service

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-service
  namespace: payment-switch
  labels:
    app: ledger-service
    tier: backend
    language: go
    version: v1.0.0
spec:
  replicas: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 3
      maxUnavailable: 1
  selector:
    matchLabels:
      app: ledger-service
  template:
    metadata:
      labels:
        app: ledger-service
        tier: backend
        language: go
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
        dapr.io/enabled: "true"
        dapr.io/app-id: "ledger-service"
        dapr.io/app-port: "50051"
        dapr.io/app-protocol: "grpc"
        dapr.io/enable-profiling: "true"
        dapr.io/log-level: "info"
        dapr.io/sidecar-cpu-limit: "1000m"
        dapr.io/sidecar-memory-limit: "512Mi"
        dapr.io/sidecar-cpu-request: "500m"
        dapr.io/sidecar-memory-request: "256Mi"
    spec:
      serviceAccountName: ledger-service
      
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      # Anti-affinity to spread pods across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: ledger-service
                topologyKey: kubernetes.io/hostname
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: ledger-service
                topologyKey: topology.kubernetes.io/zone
        
        # Prefer nodes with high-performance characteristics
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - high-performance
                      - compute-optimized
      
      # Topology spread constraints for better distribution
      topologySpreadConstraints:
        - maxSkew: 2
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: ledger-service
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: ledger-service
      
      # Init container to wait for dependencies
      initContainers:
        - name: wait-for-tigerbeetle
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z tigerbeetle.payment-switch.svc.cluster.local 3000; do
                echo "Waiting for TigerBeetle..."
                sleep 2
              done
              echo "TigerBeetle is ready"
        
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgresql.payment-switch 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready"
      
      containers:
        - name: ledger-service
          image: payment-switch/ledger-service:v1.0.0
          imagePullPolicy: IfNotPresent
          
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          
          envFrom:
            - configMapRef:
                name: ledger-service-config
            - secretRef:
                name: ledger-service-secrets
          
          env:
            # The Go Mojaloop transport rejects an unspecified cluster ID. Keep
            # this value in the TigerBeetle Vault contract, not a ConfigMap.
            - name: TIGERBEETLE_CLUSTER_ID
              valueFrom:
                secretKeyRef:
                  name: tigerbeetle-credentials
                  key: cluster-id
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          
          resources:
            requests:
              cpu: 2000m
              memory: 4Gi
              ephemeral-storage: 1Gi
            limits:
              cpu: 4000m
              memory: 8Gi
              ephemeral-storage: 2Gi
          
          # Liveness probe - checks if the service is alive
          livenessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          
          # Readiness probe - checks if the service is ready to accept traffic
          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
            successThreshold: 1
          
          # Startup probe - gives the service time to start up
          startupProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
            successThreshold: 1
          
          # Lifecycle hooks
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - sleep 15
          
          # Security context for container
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          
          # Volume mounts
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /cache
      
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
      
      # DNS configuration for faster resolution
      dnsPolicy: ClusterFirst
      dnsConfig:
        options:
          - name: ndots
            value: "2"
          - name: edns0
      
      # Termination grace period
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: ledger-service
  namespace: payment-switch
  labels:
    app: ledger-service
    tier: backend
spec:
  type: ClusterIP
  sessionAffinity: None
  selector:
    app: ledger-service
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: ledger-service-headless
  namespace: payment-switch
  labels:
    app: ledger-service
    tier: backend
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: ledger-service
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ledger-service-hpa
  namespace: payment-switch
  labels:
    app: ledger-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ledger-service
  minReplicas: 10
  maxReplicas: 50
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    - type: Pods
      pods:
        metric:
          name: grpc_requests_per_second
        target:
          type: AverageValue
          averageValue: "500"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 5
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Min

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ledger-service-pdb
  namespace: payment-switch
  labels:
    app: ledger-service
spec:
  minAvailable: 5
  selector:
    matchLabels:
      app: ledger-service

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ledger-service-network-policy
  namespace: payment-switch
  labels:
    app: ledger-service
spec:
  podSelector:
    matchLabels:
      app: ledger-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from workflow orchestrator
    - from:
        - podSelector:
            matchLabels:
              app: workflow-orchestrator
      ports:
        - protocol: TCP
          port: 50051
    # Allow traffic from payment gateway
    - from:
        - podSelector:
            matchLabels:
              app: payment-gateway
      ports:
        - protocol: TCP
          port: 50051
    # Allow traffic from other ledger service pods (for health checks)
    - from:
        - podSelector:
            matchLabels:
              app: ledger-service
      ports:
        - protocol: TCP
          port: 50051
    # Allow metrics scraping from Prometheus
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 9090
  egress:
    # Allow traffic to TigerBeetle
    - to:
        - podSelector:
            matchLabels:
              app: tigerbeetle
      ports:
        - protocol: TCP
          port: 3000
    # Allow traffic to PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app: postgresql
      ports:
        - protocol: TCP
          port: 5432
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # Allow traffic to Dapr control plane
    - to:
        - namespaceSelector:
            matchLabels:
              name: dapr-system
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443

---
apiVersion: v1
kind: ServiceMonitor
metadata:
  name: ledger-service-monitor
  namespace: payment-switch
  labels:
    app: ledger-service
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      app: ledger-service
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics

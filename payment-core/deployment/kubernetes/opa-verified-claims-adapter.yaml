apiVersion: v1
kind: ServiceAccount
metadata:
  name: opa-verified-claims-adapter
  namespace: payment-switch
  labels:
    app: opa-verified-claims-adapter
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-verified-claims-adapter-config
  namespace: payment-switch
data:
  LISTEN_ADDR: ":8080"
  # Internal Keycloak traffic must use TLS and the cluster CA must be trusted by
  # the container image. The issuer remains the public APISIX-facing issuer.
  KEYCLOAK_BASE_URL: "https://keycloak.payment-switch.svc.cluster.local:8443"
  KEYCLOAK_REALM: "payment-switch"
  KEYCLOAK_CLIENT_ID: "payment-switch-api"
  KEYCLOAK_REQUIRED_ISSUER: "https://gateway.payment-switch.example/auth/realms/payment-switch"
  KEYCLOAK_REQUIRED_AUDIENCE: "payment-switch-api"
  OPA_DECISION_URL: "http://opa.apisix.svc.cluster.local:8181/v1/data/payment/authorization"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa-verified-claims-adapter
  namespace: payment-switch
  labels:
    app: opa-verified-claims-adapter
spec:
  replicas: 2
  selector:
    matchLabels:
      app: opa-verified-claims-adapter
  template:
    metadata:
      labels:
        app: opa-verified-claims-adapter
    spec:
      serviceAccountName: opa-verified-claims-adapter
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: adapter
          image: payment-switch/opa-verified-claims-adapter:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: opa-verified-claims-adapter-config
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: opa-verified-claims-adapter
  namespace: payment-switch
  labels:
    app: opa-verified-claims-adapter
spec:
  type: ClusterIP
  selector:
    app: opa-verified-claims-adapter
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opa-verified-claims-adapter
  namespace: payment-switch
spec:
  podSelector:
    matchLabels:
      app: opa-verified-claims-adapter
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apisix
          podSelector:
            matchLabels:
              app: apisix
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: payment-switch
          podSelector:
            matchLabels:
              app: keycloak
      ports:
        - protocol: TCP
          port: 8443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apisix
          podSelector:
            matchLabels:
              app: opa
      ports:
        - protocol: TCP
          port: 8181
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

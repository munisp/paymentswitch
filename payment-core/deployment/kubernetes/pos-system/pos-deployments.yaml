---
apiVersion: v1
kind: Namespace
metadata:
  name: pos-payment-system
  labels:
    name: pos-payment-system
---
apiVersion: v1
kind: Service
metadata:
  name: fluvio-sc
  namespace: pos-payment-system
  labels:
    app: fluvio
    component: sc
spec:
  type: ClusterIP
  ports:
  - name: sc-public
    port: 9003
    targetPort: 9003
  - name: sc-private
    port: 9004
    targetPort: 9004
  selector:
    app: fluvio
    component: sc
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fluvio-sc
  namespace: pos-payment-system
  labels:
    app: fluvio
    component: sc
spec:
  serviceName: fluvio-sc
  replicas: 3
  selector:
    matchLabels:
      app: fluvio
      component: sc
  template:
    metadata:
      labels:
        app: fluvio
        component: sc
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - fluvio
            topologyKey: kubernetes.io/hostname
      containers:
      - name: fluvio-sc
        image: infinyon/fluvio:latest
        imagePullPolicy: IfNotPresent
        command:
        - /fluvio-run
        - sc
        - --bind-public
        - 0.0.0.0:9003
        - --bind-private
        - 0.0.0.0:9004
        ports:
        - name: sc-public
          containerPort: 9003
        - name: sc-private
          containerPort: 9004
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        volumeMounts:
        - name: data
          mountPath: /var/lib/fluvio
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 100Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pos-gateway-config
  namespace: pos-payment-system
data:
  FLUVIO_ENDPOINT: fluvio-sc.pos-payment-system.svc.cluster.local:9003
  FLUVIO_TOPIC: pos-transactions
  PORT: '8080'
---
apiVersion: v1
kind: Service
metadata:
  name: pos-gateway
  namespace: pos-payment-system
  labels:
    app: pos-gateway
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 80
    targetPort: 8080
  - name: metrics
    port: 9090
    targetPort: 9090
  selector:
    app: pos-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pos-gateway
  namespace: pos-payment-system
  labels:
    app: pos-gateway
spec:
  replicas: 20
  selector:
    matchLabels:
      app: pos-gateway
  template:
    metadata:
      labels:
        app: pos-gateway
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9090'
        prometheus.io/path: /metrics
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - pos-gateway
              topologyKey: kubernetes.io/hostname
      containers:
      - name: pos-gateway
        image: nextgen-payment-switch/pos-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        - name: metrics
          containerPort: 9090
        envFrom:
        - configMapRef:
            name: pos-gateway-config
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pos-gateway-hpa
  namespace: pos-payment-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pos-gateway
  minReplicas: 20
  maxReplicas: 200
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  - type: Pods
    pods:
      metric:
        name: pos_transactions_received_total
      target:
        type: AverageValue
        averageValue: '1000'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bank-adapter-config
  namespace: pos-payment-system
data:
  PORT: '8080'
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: bank-adapter-secrets
  namespace: pos-payment-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: bank-adapter-secrets
    creationPolicy: Owner
  data:
  - secretKey: ACCESS_BANK_API_KEY
    remoteRef:
      key: payment-switch/external-apis/banks
      property: access-bank-api-key
  - secretKey: GTB_API_KEY
    remoteRef:
      key: payment-switch/external-apis/banks
      property: gtb-api-key
  - secretKey: ZENITH_BANK_API_KEY
    remoteRef:
      key: payment-switch/external-apis/banks
      property: zenith-bank-api-key
---
apiVersion: v1
kind: Service
metadata:
  name: bank-adapter
  namespace: pos-payment-system
  labels:
    app: bank-adapter
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    app: bank-adapter
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-adapter
  namespace: pos-payment-system
  labels:
    app: bank-adapter
spec:
  replicas: 10
  selector:
    matchLabels:
      app: bank-adapter
  template:
    metadata:
      labels:
        app: bank-adapter
    spec:
      containers:
      - name: bank-adapter
        image: nextgen-payment-switch/bank-adapter:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: bank-adapter-config
        - secretRef:
            name: bank-adapter-secrets
        resources:
          requests:
            cpu: 1000m
            memory: 1Gi
          limits:
            cpu: 4000m
            memory: 4Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bank-adapter-hpa
  namespace: pos-payment-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bank-adapter
  minReplicas: 10
  maxReplicas: 50
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluvio-consumer-config
  namespace: pos-payment-system
data:
  FLUVIO_ENDPOINT: fluvio-sc.pos-payment-system.svc.cluster.local:9003
  FLUVIO_TOPIC: processed-transactions
  TEMPORAL_ENDPOINT: temporal-frontend.payment-switch.svc.cluster.local:7233
  CONSUMER_GROUP: pos-transaction-processor
  METRICS_PORT: '9090'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluvio-consumer
  namespace: pos-payment-system
  labels:
    app: fluvio-consumer
spec:
  replicas: 10
  selector:
    matchLabels:
      app: fluvio-consumer
  template:
    metadata:
      labels:
        app: fluvio-consumer
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9090'
        prometheus.io/path: /metrics
    spec:
      containers:
      - name: fluvio-consumer
        image: nextgen-payment-switch/fluvio-consumer:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: metrics
          containerPort: 9090
        envFrom:
        - configMapRef:
            name: fluvio-consumer-config
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fluvio-consumer-hpa
  namespace: pos-payment-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fluvio-consumer
  minReplicas: 10
  maxReplicas: 100
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pos-gateway-network-policy
  namespace: pos-payment-system
spec:
  podSelector:
    matchLabels:
      app: pos-gateway
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 9090
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: fluvio
    ports:
    - protocol: TCP
      port: 9003
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bank-adapter-network-policy
  namespace: pos-payment-system
spec:
  podSelector:
    matchLabels:
      app: bank-adapter
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pos-gateway-pdb
  namespace: pos-payment-system
spec:
  minAvailable: 10
  selector:
    matchLabels:
      app: pos-gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bank-adapter-pdb
  namespace: pos-payment-system
spec:
  minAvailable: 5
  selector:
    matchLabels:
      app: bank-adapter
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fluvio-sc-pdb
  namespace: pos-payment-system
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: fluvio
      component: sc

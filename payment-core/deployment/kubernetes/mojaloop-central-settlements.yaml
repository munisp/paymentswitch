---
apiVersion: v1
kind: Service
metadata:
  name: mojaloop-central-settlements
  namespace: payment-switch
  labels:
    app: mojaloop
    component: central-settlements
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 3007
    targetPort: 3007
    protocol: TCP
  selector:
    app: mojaloop
    component: central-settlements
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mojaloop-central-settlements
  namespace: payment-switch
  labels:
    app: mojaloop
    component: central-settlements
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mojaloop
      component: central-settlements
  template:
    metadata:
      labels:
        app: mojaloop
        component: central-settlements
      annotations:
        dapr.io/enabled: 'true'
        dapr.io/app-id: mojaloop-central-settlements
        dapr.io/app-port: '3007'
        dapr.io/config: dapr-config
    spec:
      containers:
      - name: central-settlements
        image: mojaloop/central-settlement:v15.0.0
        ports:
        - containerPort: 3007
          name: http
        env:
        - name: CSL_DATABASE_URI
          valueFrom:
            secretKeyRef:
              name: mojaloop-db-credentials
              key: central-settlements-uri
        - name: CSL_KAFKA_HOST
          value: kafka.payment-switch.svc.cluster.local
        - name: CSL_KAFKA_PORT
          value: '9092'
        - name: CSL_CENTRAL_LEDGER_URL
          value: http://mojaloop-central-ledger.payment-switch.svc.cluster.local:3001
        - name: CSL_SETTLEMENT_WINDOW_AGGREGATION_INTERVAL_MS
          value: '10000'
        - name: CSL_SETTLEMENT_DELAY_MS
          value: '2000'
        resources:
          requests:
            memory: 512Mi
            cpu: 250m
          limits:
            memory: 1Gi
            cpu: 500m
        livenessProbe:
          httpGet:
            path: /health
            port: 3007
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 3007
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mojaloop-settlement-handler
  namespace: payment-switch
  labels:
    app: mojaloop
    component: settlement-handler
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 3008
    targetPort: 3008
    protocol: TCP
  selector:
    app: mojaloop
    component: settlement-handler
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mojaloop-settlement-handler
  namespace: payment-switch
  labels:
    app: mojaloop
    component: settlement-handler
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mojaloop
      component: settlement-handler
  template:
    metadata:
      labels:
        app: mojaloop
        component: settlement-handler
    spec:
      containers:
      - name: settlement-handler
        image: mojaloop/central-settlement:v15.0.0
        command:
        - node
        - src/handlers/index.js
        - handler
        - --settlement
        ports:
        - containerPort: 3008
          name: http
        env:
        - name: CSL_DATABASE_URI
          valueFrom:
            secretKeyRef:
              name: mojaloop-db-credentials
              key: central-settlements-uri
        - name: CSL_KAFKA_HOST
          value: kafka.payment-switch.svc.cluster.local
        - name: CSL_KAFKA_PORT
          value: '9092'
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 250m
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mojaloop-db-credentials
  namespace: payment-switch
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mojaloop-db-credentials
    creationPolicy: Owner
  data:
  - secretKey: central-settlements-uri
    remoteRef:
      key: payment-switch/mojaloop/database-uris
      property: central-settlements-uri
  - secretKey: central-ledger-uri
    remoteRef:
      key: payment-switch/mojaloop/database-uris
      property: central-ledger-uri
  - secretKey: account-lookup-uri
    remoteRef:
      key: payment-switch/mojaloop/database-uris
      property: account-lookup-uri
  - secretKey: quoting-service-uri
    remoteRef:
      key: payment-switch/mojaloop/database-uris
      property: quoting-service-uri

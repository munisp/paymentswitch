---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: settlement-service
  namespace: payment-switch
  labels:
    app: settlement-service
    tier: core
spec:
  replicas: 2
  selector:
    matchLabels:
      app: settlement-service
  template:
    metadata:
      labels:
        app: settlement-service
    spec:
      containers:
      - name: settlement-service
        image: payment-switch/settlement-service:latest
        ports:
        - containerPort: 8000
        env:
        - name: POSTGRES_HOST
          valueFrom:
            secretKeyRef:
              name: settlement-secrets
              key: POSTGRES_HOST
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: settlement-secrets
              key: POSTGRES_PASSWORD
        - name: REDIS_HOST
          value: redis.payment-switch.svc.cluster.local
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: kafka.payment-switch.svc.cluster.local:9092
        - name: TIGERBEETLE_HOST
          value: tigerbeetle.payment-switch.svc.cluster.local:3000
        - name: MOJALOOP_CENTRAL_SETTLEMENTS_URL
          value: http://mojaloop-central-settlements.payment-switch.svc.cluster.local:3007
        resources:
          requests:
            memory: 256Mi
            cpu: 200m
          limits:
            memory: 1Gi
            cpu: 1000m
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - settlement-service
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: settlement-service
  namespace: payment-switch
  labels:
    app: settlement-service
spec:
  selector:
    app: settlement-service
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
  type: ClusterIP
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: settlement-secrets
  namespace: payment-switch
  labels:
    app: settlement-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: settlement-secrets
    creationPolicy: Owner
  data:
  - secretKey: POSTGRES_HOST
    remoteRef:
      key: payment-switch/settlement
      property: host
  - secretKey: POSTGRES_PASSWORD
    remoteRef:
      key: payment-switch/settlement
      property: password

---
# ML API Adapter (no database, just Kafka)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mojaloop-api-adapter
  namespace: payment-switch
  labels:
    app: mojaloop
    component: api-adapter
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mojaloop
      component: api-adapter
  template:
    metadata:
      labels:
        app: mojaloop
        component: api-adapter
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "mojaloop-api-adapter"
        dapr.io/app-port: "3000"
        dapr.io/config: "dapr-config"
    spec:
      serviceAccountName: mojaloop-service
      containers:
        - name: api-adapter
          image: mojaloop/ml-api-adapter:v14.0.0
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: MLAPI_ENDPOINT_SOURCE_URL
              value: "http://mojaloop-api-adapter:3000"
            - name: MLAPI_ENDPOINT_HEALTH_URL
              value: "http://mojaloop-api-adapter:3000/health"
            - name: MLAPI_KAFKA__PRODUCER__BROKER_LIST
              value: "kafka.payment-switch.svc.cluster.local:9092"
            - name: MLAPI_KAFKA__CONSUMER__BROKER_LIST
              value: "kafka.payment-switch.svc.cluster.local:9092"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"

---
# ServiceAccount for Mojaloop services
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mojaloop-service
  namespace: payment-switch

---
# Services
apiVersion: v1
kind: Service
metadata:
  name: mojaloop-central-ledger
  namespace: payment-switch
spec:
  ports:
    - port: 3001
      targetPort: 3001
      name: http
  selector:
    app: mojaloop
    component: central-ledger

---
apiVersion: v1
kind: Service
metadata:
  name: mojaloop-account-lookup
  namespace: payment-switch
spec:
  ports:
    - port: 4002
      targetPort: 4002
      name: http
  selector:
    app: mojaloop
    component: account-lookup

---
apiVersion: v1
kind: Service
metadata:
  name: mojaloop-quoting-service
  namespace: payment-switch
spec:
  ports:
    - port: 3002
      targetPort: 3002
      name: http
  selector:
    app: mojaloop
    component: quoting-service

---
apiVersion: v1
kind: Service
metadata:
  name: mojaloop-central-settlements
  namespace: payment-switch
spec:
  ports:
    - port: 3007
      targetPort: 3007
      name: http
  selector:
    app: mojaloop
    component: central-settlements

---
apiVersion: v1
kind: Service
metadata:
  name: mojaloop-api-adapter
  namespace: payment-switch
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: mojaloop
    component: api-adapter

---
# HorizontalPodAutoscaler for Central Ledger
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mojaloop-central-ledger-hpa
  namespace: payment-switch
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mojaloop-central-ledger
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# PodDisruptionBudgets
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mojaloop-central-ledger-pdb
  namespace: payment-switch
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: mojaloop
      component: central-ledger

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mojaloop-api-adapter-pdb
  namespace: payment-switch
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: mojaloop
      component: api-adapter

---
# NetworkPolicy for Mojaloop services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mojaloop-services-network-policy
  namespace: payment-switch
spec:
  podSelector:
    matchLabels:
      app: mojaloop
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from API gateway
    - from:
        - podSelector:
            matchLabels:
              app: apisix
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 3001
        - protocol: TCP
          port: 3002
        - protocol: TCP
          port: 3007
        - protocol: TCP
          port: 4002
    # Allow from other Mojaloop services
    - from:
        - podSelector:
            matchLabels:
              app: mojaloop
  egress:
    # Allow to PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: mojaloop-postgres
      ports:
        - protocol: TCP
          port: 5432
    # Allow to Kafka
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - protocol: TCP
          port: 9092
    # Allow to TigerBeetle Go service
    - to:
        - podSelector:
            matchLabels:
              app: mojaloop-go-service
      ports:
        - protocol: TCP
          port: 8080
    # Allow DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53

      labels:
        app: mojaloop
        component: account-lookup
        database: postgres
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "mojaloop-account-lookup"
        dapr.io/app-port: "4002"
        dapr.io/config: "dapr-config"
    spec:
      serviceAccountName: mojaloop-service
      containers:
        - name: account-lookup
          image: mojaloop/account-lookup-service:v14.0.0
          ports:
            - containerPort: 4002
              name: http
          env:
            # PostgreSQL connection
            - name: ALS_DATABASE__CLIENT
              value: "pg"
            - name: ALS_DATABASE__HOST
              valueFrom:
                configMapKeyRef:
                  name: mojaloop-postgres-config
                  key: DB_HOST
            - name: ALS_DATABASE__PORT
              valueFrom:
                configMapKeyRef:
                  name: mojaloop-postgres-config
                  key: DB_PORT
            - name: ALS_DATABASE__USER
              valueFrom:
                secretKeyRef:
                  name: mojaloop-postgres-credentials
                  key: username
            - name: ALS_DATABASE__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mojaloop-postgres-credentials
                  key: password
            - name: ALS_DATABASE__DATABASE
              value: "account_lookup"
            # Kafka
            - name: ALS_KAFKA__PRODUCER__BROKER_LIST
              value: "kafka.payment-switch.svc.cluster.local:9092"
            - name: ALS_KAFKA__CONSUMER__BROKER_LIST
              value: "kafka.payment-switch.svc.cluster.local:9092"
          livenessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"


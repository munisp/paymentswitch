---
# Mojaloop Services Deployment with PostgreSQL
# This replaces MySQL with PostgreSQL while maintaining TigerBeetle as the ledger
# Compatible with future Mojaloop updates via Knex dialect switching

apiVersion: v1
kind: ConfigMap
metadata:
  name: mojaloop-postgres-config
  namespace: payment-switch
data:
  # Database configuration for PostgreSQL
  DB_TYPE: "postgres"
  DB_HOST: "mojaloop-postgres-pooler-rw.payment-switch.svc.cluster.local"
  DB_PORT: "5432"
  DB_CONNECTION_POOL_MIN: "20"
  DB_CONNECTION_POOL_MAX: "100"
  DB_ACQUIRE_TIMEOUT: "10000"
  DB_CREATE_TIMEOUT: "30000"
  DB_DESTROY_TIMEOUT: "5000"
  DB_IDLE_TIMEOUT: "30000"
  
  # Handler concurrency
  HANDLER_CONCURRENCY: "200"
  DB_REAP_INTERVAL: "1000"
  DB_CREATE_RETRY_INTERVAL: "200"
  
  # Knex configuration for PostgreSQL
  KNEX_CLIENT: "pg"
  
  # TigerBeetle remains the ledger
  TIGERBEETLE_HOST: "tigerbeetle.payment-switch.svc.cluster.local"
  TIGERBEETLE_PORT: "3000"

---
# Central Ledger with PostgreSQL
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mojaloop-central-ledger
  namespace: payment-switch
  labels:
    app: mojaloop
    component: central-ledger
    database: postgres
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mojaloop
      component: central-ledger
  template:
    metadata:
      labels:
        app: mojaloop
        component: central-ledger
        database: postgres
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "mojaloop-central-ledger"
        dapr.io/app-port: "3001"
        dapr.io/config: "dapr-config"
    spec:
      serviceAccountName: mojaloop-service
      containers:
        - name: central-ledger
          image: mojaloop/central-ledger:v17.0.0
          ports:
            - containerPort: 3001
              name: http
          env:
            # PostgreSQL connection
            - name: CLEDG_DATABASE__CLIENT
              value: "pg"
            - name: CLEDG_DATABASE__HOST
              valueFrom:
                configMapKeyRef:
                  name: mojaloop-postgres-config
                  key: DB_HOST
            - name: CLEDG_DATABASE__PORT
              valueFrom:
                configMapKeyRef:
                  name: mojaloop-postgres-config
                  key: DB_PORT
            - name: CLEDG_DATABASE__USER
              valueFrom:
                secretKeyRef:
                  name: mojaloop-postgres-credentials
                  key: username
            - name: CLEDG_DATABASE__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mojaloop-postgres-credentials
                  key: password
            - name: CLEDG_DATABASE__DATABASE
              value: "central_ledger"
            - name: CLEDG_DATABASE__POOL_MIN
              valueFrom:
                configMapKeyRef:
                  name: mojaloop-postgres-config
                  key: DB_CONNECTION_POOL_MIN
            - name: CLEDG_DATABASE__POOL_MAX
              valueFrom:
                configMapKeyRef:
                  name: mojaloop-postgres-config
                  key: DB_CONNECTION_POOL_MAX
            # Kafka
            - name: CLEDG_KAFKA__PRODUCER__BROKER_LIST
              value: "kafka.payment-switch.svc.cluster.local:9092"
            - name: CLEDG_KAFKA__CONSUMER__BROKER_LIST
              value: "kafka.payment-switch.svc.cluster.local:9092"
            # TigerBeetle integration (via Go service)
            - name: TIGERBEETLE_ENABLED
              value: "true"
            - name: TIGERBEETLE_SERVICE_URL
              value: "http://mojaloop-go-service.payment-switch.svc.cluster.local:8080"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "2000m"

---

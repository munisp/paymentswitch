#cloud-config
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - git
  - jq
  - openssl
  - python3
  - python3-pip
  - apt-transport-https
  - gnupg
  - lsb-release
  - uidmap

write_files:
  - path: /usr/local/sbin/bootstrap-paymentswitch-kind
    permissions: '0750'
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -Eeuo pipefail
      export DEBIAN_FRONTEND=noninteractive

      if ! command -v docker >/dev/null; then
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
        . /etc/os-release
        printf 'deb [arch=%s signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu %s stable\n' "$(dpkg --print-architecture)" "$VERSION_CODENAME" > /etc/apt/sources.list.d/docker.list
        apt-get update
        apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
      fi
      systemctl enable --now docker
      usermod -aG docker ubuntu || true

      install -m 0755 -d /usr/local/bin
      if ! command -v kubectl >/dev/null; then
        curl -fsSL https://dl.k8s.io/release/stable.txt -o /tmp/kubectl-version
        curl -fsSLo /usr/local/bin/kubectl "https://dl.k8s.io/release/$(cat /tmp/kubectl-version)/bin/linux/amd64/kubectl"
        chmod 0755 /usr/local/bin/kubectl
      fi
      if ! command -v kind >/dev/null; then
        curl -fsSLo /usr/local/bin/kind https://kind.sigs.k8s.io/dl/v0.29.0/kind-linux-amd64
        chmod 0755 /usr/local/bin/kind
      fi
      if ! command -v helm >/dev/null; then
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      fi

      export KUBECONFIG=/home/ubuntu/.kube/config
      install -d -m 0700 -o ubuntu -g ubuntu /home/ubuntu/.kube
      if ! kind get clusters | grep -qx paymentswitch-staging; then
        kind create cluster --name paymentswitch-staging --wait 120s
      fi
      chown -R ubuntu:ubuntu /home/ubuntu/.kube

      helm repo add external-secrets https://charts.external-secrets.io
      helm repo add jetstack https://charts.jetstack.io
      helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/
      helm repo update

      helm upgrade --install external-secrets external-secrets/external-secrets \
        --namespace external-secrets --create-namespace \
        --set installCRDs=true --wait --timeout 5m
      helm upgrade --install cert-manager jetstack/cert-manager \
        --namespace cert-manager --create-namespace \
        --set crds.enabled=true --wait --timeout 5m
      helm upgrade --install metrics-server metrics-server/metrics-server \
        --namespace kube-system \
        --set args={--kubelet-insecure-tls,--kubelet-preferred-address-types=InternalIP\,Hostname\,ExternalIP} \
        --wait --timeout 5m

      kubectl wait --for=condition=available deployment/external-secrets -n external-secrets --timeout=180s
      kubectl wait --for=condition=available deployment/cert-manager -n cert-manager --timeout=180s
      kubectl get nodes
      kubectl get pods -A

runcmd:
  - [bash, -lc, '/usr/local/sbin/bootstrap-paymentswitch-kind > /var/log/paymentswitch-kind-bootstrap.log 2>&1']
